<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feeder Stats</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font: 14px system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    main {
      display: flex;
      flex-direction: column;
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    .chart-container {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
    }
  </style>
</head>

<body>
  <main>
    <h1>Feeder Stats</h1>
    <nav aria-label="Language pages">
      <a href="https://billiards.tailuge.workers.dev/chinese.html">Chinese</a> |
      <a href="https://billiards.tailuge.workers.dev/korean.html">Korean</a> |
      <a href="https://billiards.tailuge.workers.dev/german.html">German</a> |
      <a href="https://billiards.tailuge.workers.dev/turkish.html">Turkish</a> |
      <a href="https://billiards.tailuge.workers.dev/vietnamese.html">Vietnamese</a> |
      <a href="https://billiards.tailuge.workers.dev/japanese.html">Japanese</a> |
      <a href="https://billiards.tailuge.workers.dev/spanish.html">Spanish</a> |
      <a href="https://billiards.tailuge.workers.dev/dutch.html">Dutch</a> |
      <a href="https://billiards.tailuge.workers.dev/snooker.html">Snooker</a> |
      <a href="https://billiards.tailuge.workers.dev/nineball.html">Nine Ball</a> |
      <a href="https://billiards.tailuge.workers.dev/eightball.html">Eight Ball</a>
    </nav>
    <p id="status">Loading...</p>
    <div class="chart-container">
      <canvas id="usage-chart" aria-label="Usage by language and date"></canvas>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
  <script>
    const series = [
      ["chineseUsage", "Chinese", "#d33", false],
      ["koreanUsage", "Korean", "#36c", false],
      ["germanUsage", "German", "#393", false],
      ["turkishUsage", "Turkish", "#c83", false],
      ["vietnameseUsage", "Vietnamese", "#93c", false],
      ["japaneseUsage", "Japanese", "#653", false],
      ["spanishUsage", "Spanish", "#e67e22", false],
      ["dutchUsage", "Dutch", "#0891b2", false],
      ["snookerUsage", "Snooker", "#8e44ad", true],
      ["nineballUsage", "Nine Ball", "#2563eb", true],
      ["eightballUsage", "Eight Ball", "#111827", true]
    ];

    function valuesByDate(values) {
      return Object.fromEntries(values.map(item => [item.date, item.count]));
    }

    async function loadUsage() {
      const status = document.getElementById("status");
      try {
        const response = await fetch("/api/usage");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const dates = [...new Set(series.flatMap(([key]) =>
          Array.isArray(data[key]) ? data[key].map(item => item.date) : []
        ))].sort();

        new Chart(document.getElementById("usage-chart"), {
          type: "line",
          data: {
            labels: dates,
            datasets: series.map(([key, label, color, isDotted]) => {
              const values = valuesByDate(Array.isArray(data[key]) ? data[key] : []);
              return {
                label,
                data: dates.map(date => values[date] || 0),
                borderColor: color,
                backgroundColor: color,
                pointRadius: 2,
                borderDash: isDotted ? [3, 3] : [],
                tension: 0
              };
            })
          },
          options: {
            animation: false,
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true } }
          }
        });
        status.textContent = `${dates.length} day${dates.length === 1 ? "" : "s"}`;
      } catch (error) {
        status.textContent = `Could not load usage: ${error.message}`;
      }
    }

    loadUsage();
  </script>
</body>

</html>
