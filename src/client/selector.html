<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Selector — Variant Selection Modal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@200;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg:           #f5f5f5;
        --surface:      #ffffff;
        --border:       #dddddd;
        --text:         #212121;
        --text-muted:   #757575;
        --text-dim:     #555555;
        --btn-bg:       #ffffff;
        --btn-border:   #cccccc;
        --btn-hover:    #f0f0f0;
        --btn-active:   #e0e0e0;
        --modal-bg:     #ffffff;
        --modal-cancel: #f8f9fa;
        --accent:       #0d6efd;
        --accent-hover: #0b5ed7;
      }
      html[data-theme="dark"] {
        --bg:           #1a1a1a;
        --surface:      #2a2a2a;
        --border:       #444444;
        --text:         #e0e0e0;
        --text-muted:   #aaaaaa;
        --text-dim:     #aaaaaa;
        --btn-bg:       #3a3a3a;
        --btn-border:   #555555;
        --btn-hover:    #444444;
        --btn-active:   #505050;
        --modal-bg:     #2a2a2a;
        --modal-cancel: #3a3a3a;
        --accent:       #6ba3f5;
        --accent-hover: #4c8bef;
      }
      body {
        margin: 0;
        padding: 1rem;
        background: var(--bg);
        color: var(--text);
        font-family: 'Exo', sans-serif;
        font-weight: 200;
      }
      .page-head {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        max-width: 720px;
        margin: 0 auto 0.8rem;
      }
      .page-head h1 {
        flex: 1;
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .page-head .toggle {
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--text);
        border-radius: 4px;
        padding: 0.25rem 0.6rem;
        cursor: pointer;
        font: inherit;
        font-size: 0.75rem;
      }
      .openers {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
        max-width: 720px;
        margin: 0 auto;
      }
      .openers button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.45rem 1rem;
        cursor: pointer;
        border-radius: 4px;
        color: #fff;
        border: none;
      }
      .openers .solo-btn { background: #198754; }
      .openers .solo-btn:hover { background: #157347; }
      .openers .chal-btn { background: var(--accent); }
      .openers .chal-btn:hover { background: var(--accent-hover); }
      .launch-log {
        max-width: 720px;
        margin: 0.8rem auto 0;
        padding: 0.4rem 0.6rem;
        border: 1px dashed var(--border);
        border-radius: 6px;
        font-size: 0.68rem;
        color: var(--text-muted);
        word-break: break-all;
        min-height: 2.2em;
        box-sizing: border-box;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.3/+esm"
        }
      }
    </script>
  </head>
  <body>
    <div class="page-head">
      <h1>Selector · Variant Selection Modal</h1>
      <button class="toggle" id="themeToggle">🌙 Dark</button>
    </div>

    <div class="openers">
      <button class="solo-btn" id="openSolo">▶ Solo play</button>
      <button class="chal-btn" id="openChal">⚔ Challenge Alice</button>
    </div>

    <div class="launch-log" id="log">Last confirm will appear here…</div>

    <selector-modal id="modalSolo" mode="solo"></selector-modal>
    <selector-modal id="modalChal" mode="challenge" opponent="Alice"></selector-modal>

    <script type="module">
      import './selector-modal.js';

      document.addEventListener('confirm', (e) => {
        const { mode, ruleType, options, opponent } = e.detail;
        const params = new URLSearchParams({ ruletype: ruleType, ...options }).toString();
        log.textContent =
          `[${mode}] ${location.origin}/game/?${params}` +
          (opponent ? `  → offer sent to ${opponent}` : '');
      });
      document.addEventListener('cancel', () => { log.textContent = 'Cancelled.'; });

      document.getElementById('openSolo').onclick = () => document.getElementById('modalSolo').show();
      document.getElementById('openChal').onclick = () => document.getElementById('modalChal').show();

      document.getElementById('themeToggle')?.addEventListener('click', (e) => {
        const root = document.documentElement;
        const dark = root.dataset.theme !== 'dark';
        root.dataset.theme = dark ? 'dark' : 'light';
        e.target.textContent = dark ? '☀️ Light' : '🌙 Dark';
      });
    </script>
  </body>
</html>
