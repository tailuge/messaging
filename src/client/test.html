<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lobby Test</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; overflow: hidden; scrollbar-width: none; }
        body::-webkit-scrollbar { display: none; }
        .pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ddd; overflow: hidden; }
        .pane:last-child { border-right: none; }
        .pane-label { background: #333; color: #fff; padding: 0.2rem 0.5rem; font-size: 0.75rem; text-align: center; }
        iframe { flex: 1; border: none; overflow: hidden; scrollbar-width: none; }
        iframe::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <script src="test.js"></script>
</body>
</html>
