<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Active Tables Spectator</title>
    <link rel="icon" type="image/png" href="assets/threecushion.png" />
    <style>
      body {
        font-family: monospace;
        font-size: 11px;
        background: #ffffff;
        color: #000000;
        margin: 10px;
        line-height: 1.4;
      }
      h1, h2 {
        font-size: 12px;
        margin: 0 0 10px 0;
        text-transform: uppercase;
        border-bottom: 1px solid #ccc;
        padding-bottom: 3px;
      }
      ul {
        list-style-type: none;
        padding: 0;
        margin: 0 0 15px 0;
      }
      li {
        margin: 3px 0;
      }
      .table-link {
        color: #0000ee;
        text-decoration: underline;
        cursor: pointer;
      }
      .table-link:hover {
        color: #551a8b;
      }
      #spectator-section {
        margin-top: 15px;
        display: none;
      }
      .status {
        font-style: italic;
        margin-bottom: 10px;
        color: #555;
      }
      .event-item {
        padding: 1px 0;
        font-size: 10px;
        line-height: 1.25;
      }
      .event-item:hover {
        background: #f7f7f7;
      }
      .event-header {
        cursor: pointer;
      }
      .raw-data {
        display: none;
        background: #fdfdfd;
        border: 1px solid #ddd;
        padding: 5px;
        margin: 5px 0;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 9px;
      }
      .raw-data.expanded {
        display: block;
      }
      .event-time {
        color: #888;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Active Tables</h1>
    <ul id="table-list"></ul>

    <div id="spectator-section">
      <h2 id="spectator-title">Spectating Table</h2>
      <div id="spectator-status" class="status">Connecting...</div>
      <ul id="event-list"></ul>
    </div>

    <script type="module">
      import { MessagingClient } from './messaging.js';

      const tableListEl = document.getElementById('table-list');
      const spectatorSection = document.getElementById('spectator-section');
      const spectatorTitle = document.getElementById('spectator-title');
      const spectatorStatus = document.getElementById('spectator-status');
      const eventList = document.getElementById('event-list');

      // 1. Parse active tables from URL parameters
      const params = new URLSearchParams(location.search);
      const activeTables = params.getAll('active');

      if (activeTables.length === 0) {
        tableListEl.innerHTML = '<li>No active tables specified.</li>';
      } else {
        activeTables.forEach(tableId => {
          const li = document.createElement('li');
          const span = document.createElement('span');
          span.className = 'table-link';
          span.textContent = tableId;
          span.onclick = () => selectTable(tableId);
          li.appendChild(span);
          tableListEl.appendChild(li);
        });
      }

      let currentClient = null;
      let currentTable = null;
      let idleTimer = null;
      let messageCount = 0;

      // Format epoch ms as MM:SS:mmm (minutes:seconds:milliseconds of the time-of-day)
      function formatTimestamp(ts) {
        if (typeof ts !== 'number' || !isFinite(ts)) return '--:--:---';
        const d = new Date(ts);
        const mm = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        const ms = String(d.getMilliseconds()).padStart(3, '0');
        return `${mm}:${ss}:${ms}`;
      }

      // Build a single event item row showing the latest payload. When the
      // incoming message is a duplicate-AIM burst from the same sender as the
      // previous row, the previous row is silently replaced (no count badge).
      function createEventItem(msg) {
        const li = document.createElement('li');
        li.className = 'event-item';
        li.dataset.type = msg.type || '';
        li.dataset.senderId = msg.senderId || '';

        const dataObj = msg.data || {};
        const senderName =
          dataObj.userName || dataObj.name || dataObj.playername || '';
        const senderDisplay = senderName
          ? `${senderName} (${msg.senderId})`
          : msg.senderId;
        const tsText = formatTimestamp(msg.meta?.ts);

        const headerDiv = document.createElement('div');
        headerDiv.className = 'event-header';

        const timeSpan = document.createElement('span');
        timeSpan.className = 'event-time';
        timeSpan.textContent = `[${tsText}]`;
        headerDiv.appendChild(timeSpan);

        headerDiv.append(`[${msg.type}] from ${senderDisplay}`);
        li.appendChild(headerDiv);

        // Privacy: redact chat payloads before serializing into the JSON
        // view. The collapse key (msg.type, msg.senderId) was already
        // computed above from the untouched message, so collapse behaviour
        // is unaffected by the redaction.
        const view =
          msg.type === 'CHAT' && msg.data && 'message' in msg.data
            ? { ...msg, data: { ...msg.data } }
            : msg;
        if (view !== msg) delete view.data.message;

        const pre = document.createElement('pre');
        pre.className = 'raw-data';
        pre.textContent = JSON.stringify(view, null, 2);
        li.appendChild(pre);

        return li;
      }

      // Single delegated listener: clicking the header toggles only that row's
      // JSON. Selection inside the JSON never reaches this handler.
      eventList.addEventListener('click', (e) => {
        const header = e.target.closest('.event-header');
        if (!header || !eventList.contains(header)) return;
        const li = header.parentElement;
        const pre = li.querySelector('.raw-data');
        if (pre) pre.classList.toggle('expanded');
      });

      async function cleanup() {
        if (idleTimer) {
          clearTimeout(idleTimer);
          idleTimer = null;
        }
        if (currentTable) {
          try {
            await currentTable.leave();
          } catch (e) {
            console.error('Error leaving table:', e);
          }
          currentTable = null;
        }
        if (currentClient) {
          try {
            await currentClient.stop();
          } catch (e) {
            console.error('Error stopping client:', e);
          }
          currentClient = null;
        }
      }

      function resetIdleTimer() {
        if (idleTimer) {
          clearTimeout(idleTimer);
        }
        idleTimer = setTimeout(async () => {
          spectatorStatus.textContent =
            messageCount > 0
              ? `Received ${messageCount} message${messageCount === 1 ? '' : 's'}`
              : 'No events received';
          await cleanup();
        }, 1000);
      }

      async function selectTable(tableId) {
        // Clean up previous subscription
        await cleanup();

        // Setup UI
        spectatorTitle.textContent = `Spectating: ${tableId}`;
        spectatorStatus.textContent = 'Connecting...';
        eventList.innerHTML = '';
        spectatorSection.style.display = 'block';
        messageCount = 0;

        // Base URL logic
        let baseUrl = 'https://billiards-network.onrender.com';
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          const protocol = location.protocol === 'https:' ? 'https:' : 'http:';
          baseUrl = `${protocol}//${location.host}`;
        }

        try {
          currentClient = new MessagingClient({ baseUrl });
          currentClient.start();

          // Connect as spectator with early onMessage listener (Solution A)
          currentTable = await currentClient.spectateTable(tableId, 'spectator', {
            onMessage: (msg) => {
              // Reset idle timer whenever a message is received
              resetIdleTimer();
              messageCount++;

              // Only collapse consecutive AIM bursts from the same sender.
              // Every other message type is shown individually.
              const lastLi = eventList.lastElementChild;
              const sameAimAsLast =
                msg.type === 'AIM' &&
                msg.senderId &&
                lastLi &&
                lastLi.classList.contains('event-item') &&
                lastLi.dataset.type === msg.type &&
                lastLi.dataset.senderId === msg.senderId;

              if (sameAimAsLast) {
                // Silently delete duplicates: replace lastLi with the latest
                // payload only. No count badge, no duration label.
                const replacement = createEventItem(msg);
                if (
                  lastLi.querySelector('.raw-data').classList.contains('expanded')
                ) {
                  replacement
                    .querySelector('.raw-data')
                    .classList.add('expanded');
                }
                eventList.replaceChild(replacement, lastLi);
              } else {
                eventList.appendChild(createEventItem(msg));
              }
            }
          });
          spectatorStatus.textContent = 'Connected. Waiting for events...';

          // Start initial 1 second idle timer immediately on connection
          resetIdleTimer();
        } catch (err) {
          spectatorStatus.textContent = `Error: ${err.message}`;
          console.error(err);
        }
      }
    </script>
  </body>
</html>
