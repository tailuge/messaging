<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Terminal: Usage</title>
  <meta name="description" content="A dashboard for monitoring usage metrics." />
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: "IBM Plex Mono", monospace;
      margin: 0;
      padding: 10px 20px;
      /* Column layout so the link footer can sit at the bottom of the page. */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin: 0;
    }
    .server-stats-links a {
      color: #58a6ff;
      text-decoration: none;
      margin-left: 14px;
      font-size: 0.7rem;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 10px;
    }
    .chart-container {
      background-color: #111;
      border: 1px solid #333;
      padding: 0;
      height: 400px;
    }
    .chart-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .chart-panel-title {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    /* API bytes by route, under the charts at the end of the page. */
    .routes-section {
      margin-top: 10px;
    }
    .routes-section .chart-panel-title {
      margin-bottom: 6px;
    }
    .routes-table {
      width: 100%;
      max-width: 560px;
      border-collapse: collapse;
      font-size: 0.68rem;
      color: #999;
    }
    .routes-table th,
    .routes-table td {
      text-align: left;
      padding: 2px 8px 2px 0;
    }
    .routes-table th {
      font-weight: 600;
      color: #777;
    }
    .routes-table th + th,
    .routes-table td + td {
      text-align: right;
      width: 80px;
    }
    .routes-table .net-route-name {
      display: block;
      max-width: 300px;
      color: #58a6ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* The pages the counters above are measured on: one-word links, in a
       footer so they stay clear of the charts. Absolute URLs on the Cloudflare
       host that serves those pages, not this dashboard's host. */
    .source-pages {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 14px;
      /* Pushed to the bottom of the page by the flex column above. */
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid #333;
      font-size: 0.7rem;
    }
    .source-pages a {
      color: #58a6ff;
      text-decoration: none;
    }
    .source-pages a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header class="header">
    <h1 class="title">USAGE</h1>
    <div class="server-stats-links">
      <a href="https://vercel.com/tailuges-projects/~/usage" target="_blank">VERCEL</a>
      <a href="https://dashboard.render.com/web/srv-ctk5bmtds78s73eteil0/metrics" target="_blank">RENDER</a>
    </div>
  </header>
  <main id="chart-grid" class="chart-grid">
    <div id="lobby-game" class="chart-container"></div>
    <div id="challenges-accepts" class="chart-container"></div>
    <div id="games-completed" class="chart-container"></div>
  </main>

  <section class="chart-section">
    <div id="lang-chart" class="chart-container" aria-label="Usage by language"></div>
    <div id="game-chart" class="chart-container" aria-label="Usage by game type"></div>
    <div id="activity-chart" class="chart-container"
      aria-label="Users online and network bytes since uptime"></div>
  </section>

  <section class="routes-section" aria-label="API bytes by route">
    <h2 class="chart-panel-title">API BYTES BY ROUTE</h2>
    <table class="routes-table">
      <thead>
        <tr>
          <th scope="col">Route</th>
          <th scope="col">Total bytes</th>
          <th scope="col">Calls</th>
        </tr>
      </thead>
      <tbody id="net-routes"></tbody>
    </table>
  </section>

  <footer class="source-pages" aria-label="Measured pages">
    <a href="https://billiards.tailuge.workers.dev/chinese.html" target="_blank" rel="noopener">Chinese</a>
    <a href="https://billiards.tailuge.workers.dev/korean.html" target="_blank" rel="noopener">Korean</a>
    <a href="https://billiards.tailuge.workers.dev/german.html" target="_blank" rel="noopener">German</a>
    <a href="https://billiards.tailuge.workers.dev/turkish.html" target="_blank" rel="noopener">Turkish</a>
    <a href="https://billiards.tailuge.workers.dev/vietnamese.html" target="_blank" rel="noopener">Vietnamese</a>
    <a href="https://billiards.tailuge.workers.dev/japanese.html" target="_blank" rel="noopener">Japanese</a>
    <a href="https://billiards.tailuge.workers.dev/spanish.html" target="_blank" rel="noopener">Spanish</a>
    <a href="https://billiards.tailuge.workers.dev/dutch.html" target="_blank" rel="noopener">Dutch</a>
    <a href="https://billiards.tailuge.workers.dev/snooker.html" target="_blank" rel="noopener">Snooker</a>
    <a href="https://billiards.tailuge.workers.dev/nineball.html" target="_blank" rel="noopener">Nineball</a>
    <a href="https://billiards.tailuge.workers.dev/eightball.html" target="_blank" rel="noopener">Eightball</a>
    <a href="https://billiards.tailuge.workers.dev/threecushion.html" target="_blank" rel="noopener">Three Cushion</a>
    <a href="https://billiards.tailuge.workers.dev/map/index.html" target="_blank" rel="noopener">Map</a>
    <a href="https://billiards.tailuge.workers.dev/reveal/" target="_blank" rel="noopener">Reveal</a>
    <a href="https://billiards.tailuge.workers.dev/challenge/" target="_blank" rel="noopener">Challenge</a>
    <a href="https://billiards.tailuge.workers.dev/lobby" target="_blank" rel="noopener">Lobby</a>
    <a href="https://billiards.tailuge.workers.dev/" target="_blank" rel="noopener">Game</a>
  </footer>

  <script src="https://cdn.plot.ly/plotly-cartesian-3.0.0-rc.0.min.js"
    integrity="sha384-k9BNvphELWyBtQVTUBS5YYM9SAb3H4NoA6hxg6YARuWJqdp+yp8F3mJN405LN+KC"    crossorigin="anonymous"></script>



  <script type="module">
    const GROUPS = [
      {
        id: "lobby-game",
        label: "LOBBY & GAME ACTIVITY",
        metrics: [
          { id: "lobby", label: "LOBBY TRAFFIC", color: "#0055ff" },
          { id: "game", label: "GAME ACTIVITY", color: "#9c27b0" },
        ],
      },
      {
        id: "challenges-accepts",
        label: "CHALLENGES & ACCEPTS",
        metrics: [
          { id: "createTable", label: "CHALLENGES", color: "#ff3e00" },
          { id: "joinTable", label: "ACCEPTS", color: "#4caf50" },
        ],
      },
      {
        id: "games-completed",
        label: "GAMES COMPLETED",
        metrics: [
          { id: "complete", label: "GAMES COMPLETED", color: "#00bcd4" },
        ],
      },
    ]

    const DAY_MS = 24 * 60 * 60 * 1000

    const chartGrid = document.getElementById("chart-grid")

    GROUPS.forEach((group) => {
      if (!document.getElementById(group.id)) {
        const container = document.createElement("div")
        container.id = group.id
        container.className = "chart-container"
        chartGrid.appendChild(container)
      }
    })

    // One fetch feeds every panel on the page: the activity groups, the language
    // chart and the game-blog chart all read the same aggregate response, which
    // the server caches for ten minutes.
    async function loadUsage() {
      try {
        const data = await getData("/api/usage")
        GROUPS.forEach((group) => plotGroup(group, data))
        plotBlogCharts(data)
      } catch (error) {
        console.error(`Could not load usage charts: ${error.message}`)
      }
    }

    async function getData(url) {
      const response = await fetch(url)
      return response.json()
    }

    // Every panel on this page is a Plotly line chart, so the frame, fonts and
    // margins live in one place instead of drifting between libraries.
    const PLOT_CONFIG = { responsive: true, displayModeBar: false }
    const MONO_FONT = "'IBM Plex Mono', monospace"
    const SANS_FONT = "'DM Sans', sans-serif"

    function axisStyle() {
      return {
        gridcolor: "#333",
        linecolor: "#333",
        tickfont: { family: SANS_FONT, size: 9, color: "#999" },
        zeroline: false,
      }
    }

    // Shared frame: title top-left, legend to its right, quarterly date ticks,
    // and the same margins on every panel. The title is pinned to the container
    // rather than left at Plotly's default, which parks it on the top edge of
    // the plot area and leaves the whole top margin empty above it.
    function chartLayout(title, overrides = {}) {
      return {
        title: {
          text: title,
          font: { family: MONO_FONT, size: 11, color: "#888" },
          x: 0,
          xanchor: "left",
          y: 0.99,
          yref: "container",
          yanchor: "top",
        },
        xaxis: {
          ...axisStyle(),
          type: "date",
          tickangle: 0,
          dtick: "M3",
          tickformat: "%b %Y",
          ...(overrides.xaxis || {}),
        },
        yaxis: { ...axisStyle(), rangemode: "tozero", ...(overrides.yaxis || {}) },
        legend: {
          orientation: "h",
          yanchor: "bottom",
          y: 1.02,
          xanchor: "right",
          x: 1,
          font: { family: SANS_FONT, size: 9, color: "#999" },
          bgcolor: "rgba(0,0,0,0)",
        },
        plot_bgcolor: "rgba(0,0,0,0)",
        paper_bgcolor: "rgba(0,0,0,0)",
        margin: { t: 30, r: 12, b: 22, l: 30 },
        autosize: true,
        ...(overrides.extra || {}),
      }
    }

    function lineTrace({ label, color, points, dashed, axis }) {
      return {
        x: points.map((point) => point.x),
        y: points.map((point) => point.y),
        name: label,
        type: "scatter",
        mode: "lines",
        line: { color, width: 2, dash: dashed ? "dash" : "solid" },
        yaxis: axis || "y",
      }
    }

    function plotGroup(groupConfig, usage) {
      const traces = groupConfig.metrics.map((metric) => {
        const key = `${metric.id}Usage`
        const points = (Array.isArray(usage[key]) ? usage[key] : [])
          .map((d) => ({ x: d.date, y: Number(d.count) }))
          .sort((a, b) => new Date(a.x) - new Date(b.x))

        return lineTrace({ label: metric.label, color: metric.color, points })
      })

      Plotly.newPlot(groupConfig.id, traces, chartLayout(groupConfig.label), PLOT_CONFIG)
    }

    // Language and game-blog trends, read from the same aggregate response as
    // the activity panels above.
    const langSeries = [
      ["chineseUsage", "Chinese", "#d33"],
      ["koreanUsage", "Korean", "#36c"],
      ["germanUsage", "German", "#393"],
      ["turkishUsage", "Turkish", "#c83"],
      ["vietnameseUsage", "Vietnamese", "#93c"],
      ["japaneseUsage", "Japanese", "#653"],
      ["spanishUsage", "Spanish", "#e67e22"],
      ["dutchUsage", "Dutch", "#0891b2"],
    ]

    const gameSeries = [
      ["snookerUsage", "Snooker", "#8e44ad"],
      ["nineballUsage", "Nine Ball", "#2563eb"],
      ["eightballUsage", "Eight Ball", "#e5e7eb"],
      ["threecushionUsage", "Three Cushion", "#84cc16"],
      ["mapUsage", "Map", "#f39c12"],
      ["revealUsage", "Reveal", "#2dd4bf"],
      ["challengeUsage", "Challenge", "#e11d48"],
    ]

    // Language and game-blog trends: one line per page, aligned to the union of
    // dates so a day a page skipped still dips to zero for it.
    function plotBlogCharts(data) {
      plotBlogChart("lang-chart", "LANGUAGE BLOGS", langSeries, data)
      plotBlogChart("game-chart", "GAME BLOGS", gameSeries, data)
    }

    function plotBlogChart(elementId, title, series, data) {
      const rows = series.flatMap(([key]) =>
        Array.isArray(data[key]) ? data[key].map((item) => item.date) : []
      )
      const dates = [...new Set(rows)].sort()

      const traces = series.map(([key, label, color]) => {
        const counts = new Map(
          (Array.isArray(data[key]) ? data[key] : []).map((item) => [item.date, Number(item.count)])
        )
        return lineTrace({
          label,
          color,
          points: dates.map((date) => ({ x: date, y: counts.get(date) || 0 })),
        })
      })

      Plotly.newPlot(elementId, traces, chartLayout(title), PLOT_CONFIG)
    }

    // Users online and network bytes share one chart. Both series are
    // timestamped and arrival-driven (the server samples nothing on a timer),
    // so one date axis carries both; the count is read on the left axis, bytes
    // per minute on the right.
    function activityLayout(spanMs) {
      const layout = chartLayout("USERS ONLINE & NETWORK", {
        xaxis: { nticks: 8, tickformat: spanMs > DAY_MS ? "%b %d %H:%M" : "%H:%M" },
        yaxis: { tickformat: "d" },
        extra: {
          yaxis2: {
            ...axisStyle(),
            overlaying: "y",
            side: "right",
            showgrid: false,
            rangemode: "tozero",
            tickformat: "~s",
            ticksuffix: "B",
          },
        },
      })
      // Quarter ticks suit the daily charts; this axis spans minutes to days.
      delete layout.xaxis.dtick
      return layout
    }

    // Presence points exist only for minutes in which the count changed, so they
    // stay sparse: the live count at `ts` extends the line to now.
    function userPoints(data) {
      const points = (data.samples || []).map(([ts, count]) => ({ x: ts, y: Number(count) }))
      points.push({ x: data.ts, y: Number(data.current) })
      return points
    }

    function renderActivity(users, net) {
      const traces = []
      let min = Infinity
      let max = -Infinity
      const track = (points) =>
        points.forEach((point) => {
          if (point.x < min) min = point.x
          if (point.x > max) max = point.x
        })

      if (users) {
        const points = userPoints(users)
        track(points)
        traces.push(lineTrace({ label: "USERS ONLINE", color: "#f59e0b", points }))
      }
      if (net) {
        NET_SERIES.forEach((series) => {
          const points = netSeries(net, series.key)
          track(points)
          traces.push(
            lineTrace({
              label: series.label,
              color: series.color,
              points,
              dashed: series.dashed,
              axis: "y2",
            })
          )
        })
      }

      const spanMs = Number.isFinite(min) ? max - min : 0
      Plotly.newPlot("activity-chart", traces, activityLayout(spanMs), PLOT_CONFIG)
    }

    // Network bytes per minute, from the server's in-memory counters. The series
    // are dense (one slot per minute) and start at process start, so the x
    // values are generated from `start`. API bytes are counted before gzip;
    // Nchan WebSocket frames are not compressed at all, so only the API line is
    // inflated relative to the wire.
    function formatBytes(value) {
      if (!value) return "0 B"
      const units = ["B", "KB", "MB", "GB"]
      let index = 0
      let size = Number(value)
      while (size >= 1024 && index < units.length - 1) {
        size /= 1024
        index += 1
      }
      return `${size < 10 && index > 0 ? size.toFixed(1) : Math.round(size)} ${units[index]}`
    }

    const NET_SERIES = [
      { key: "presence.out", label: "PRESENCE OUT", color: "#0055ff" },
      { key: "table.out", label: "TABLE OUT", color: "#9c27b0" },
      { key: "api.out", label: "API OUT", color: "#00bcd4" },
      { key: "in", label: "PUBLISH IN", color: "#888", dashed: true },
    ]

    // `data.start` is the first minute of the window, one slot per minute.
    function netSeries(data, key) {
      const series = data.series || {}
      const blank = () => new Array(data.minutes).fill(0)
      let values
      if (key === "in") {
        const presence = series["presence.in"] || blank()
        const table = series["table.in"] || blank()
        values = presence.map((value, index) => value + (table[index] || 0))
      } else {
        values = series[key] || blank()
      }
      return values.map((value, index) => ({ x: data.start + index * 60000, y: value }))
    }

    // The busiest API routes over the same window as the chart, as three
    // columns: route, bytes, calls.
    function renderRoutes(routes) {
      const body = document.getElementById("net-routes")
      body.textContent = ""
      const top = (routes || []).filter((route) => route.bytes > 0).slice(0, 6)
      if (top.length === 0) {
        const empty = body.insertRow().insertCell()
        empty.colSpan = 3
        empty.textContent = "nothing recorded yet"
        return
      }
      top.forEach((route) => {
        const row = body.insertRow()
        const name = document.createElement("span")
        name.className = "net-route-name"
        name.textContent = route.calls ? `/api/${route.route}` : route.route
        row.insertCell().appendChild(name)
        row.insertCell().textContent = formatBytes(route.bytes)
        row.insertCell().textContent = route.calls
      })
    }

    // Both endpoints report since the server process started, so the two lines
    // always cover the same window. Loaded once per visit: this page does not
    // poll or refresh on its own.
    async function loadActivity() {
      const [users, net] = await Promise.allSettled([
        getData("/api/presence/history"),
        getData("/api/net/history"),
      ])
      if (users.status === "rejected") {
        console.error("Could not load users-online history:", users.reason)
      }
      if (net.status === "rejected") {
        console.error("Could not load network history:", net.reason)
      }
      renderActivity(
        users.status === "fulfilled" ? users.value : null,
        net.status === "fulfilled" ? net.value : null
      )
      if (net.status === "fulfilled") renderRoutes(net.value.routes)
    }

    loadUsage()
    loadActivity()
  </script>
</body>

</html>
