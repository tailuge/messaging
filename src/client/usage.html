<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Terminal: Usage</title>
  <meta name="description" content="A dashboard for monitoring usage metrics." />
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: "IBM Plex Mono", monospace;
      margin: 0;
      padding: 10px 20px;
      /* Column layout so the link footer can sit at the bottom of the page. */
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin: 0;
    }
    .server-stats-links a {
      color: #58a6ff;
      text-decoration: none;
      margin-left: 14px;
      font-size: 0.7rem;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 10px;
    }
    /* The three tables after the charts, side by side and outside the chart
       grid so they are not grouped with the plots. Flex rather than fixed
       columns: the route table keeps its narrow four-column width, the two
       referrer tables share the rest, and on a screen too narrow to hold all
       three they wrap onto their own rows at full width instead of squeezing
       the columns. */
    .tables-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      align-items: flex-start;
    }
    .tables-grid .routes-section {
      margin-top: 0;
      min-width: 0;
    }
    /* Only as wide as its 90px route plus three 80px number columns. */
    .tables-grid .net-routes-section {
      flex: 0 1 330px;
    }
    /* Grow to fill the rest of the row; 300px is the minimum before wrapping. */
    .tables-grid .referrers-section {
      flex: 1 1 300px;
    }
    .tables-grid .routes-table {
      max-width: none;
    }
    .tables-grid .net-routes-table {
      width: auto;
    }
    .chart-container {
      background-color: #111;
      border: 1px solid #333;
      padding: 0;
      /* Every panel on the page uses this height; 270px is 25% shorter than
         360px. */
      height: 270px;
    }
    .chart-panel-title {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    /* The tables under the charts at the end of the page. */
    .routes-section {
      margin-top: 10px;
    }
    .routes-section .chart-panel-title {
      margin-bottom: 6px;
    }
    .routes-table {
      width: 100%;
      max-width: 640px;
      border-collapse: collapse;
      /* Fixed layout so the column widths below are kept instead of being
         grown by long route names and URLs. */
      table-layout: fixed;
      font-size: 0.68rem;
      color: #999;
    }
    .routes-table th,
    .routes-table td {
      text-align: left;
      padding: 2px 8px 2px 0;
    }
    .routes-table th {
      font-weight: 600;
      color: #777;
    }
    .routes-table th + th,
    .routes-table td + td {
      text-align: right;
      width: 80px;
    }
    /* Route names are cut to a fixed column so the table stays narrow. */
    .net-routes-table th:first-child,
    .net-routes-table td:first-child {
      width: 90px;
    }
    .routes-table .net-route-name {
      display: block;
      max-width: 100%;
      color: #58a6ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* The referrer list spans the page instead of the 640px cap the API table
       uses for its four numeric columns. */
    .routes-table-wide {
      max-width: none;
    }
    /* The count is a short number, so it takes a fixed narrow column and the
       URL gets all the remaining width without an ellipsis. */
    .referrers-table th:first-child,
    .referrers-table td:first-child {
      text-align: left;
      width: 40px;
      white-space: nowrap;
    }
    .referrers-table th + th,
    .referrers-table td + td {
      text-align: left;
      width: auto;
    }
    .referrer-name {
      display: block;
      color: #58a6ff;
      text-decoration: none;
      /* Long URLs wrap instead of being cut off with an ellipsis. */
      word-break: break-all;
    }
    .referrer-name:hover {
      text-decoration: underline;
    }
    /* Referrers grouped by the page that reported them: the count leads the
       row in the same narrow column as the recent-referrer table, the page
       path labels the group, and the source takes the remaining width. */
    .page-referrers-table th:first-child,
    .page-referrers-table td:first-child {
      text-align: left;
      width: 40px;
      white-space: nowrap;
    }
    .page-referrers-table th:nth-child(2),
    .page-referrers-table td:nth-child(2) {
      text-align: left;
      width: 90px;
      white-space: nowrap;
    }
    .page-referrers-table th:last-child,
    .page-referrers-table td:last-child {
      text-align: left;
      width: auto;
    }
    .page-referrers-table .page-name {
      color: #e6edf3;
      font-weight: 600;
      vertical-align: top;
    }
    /* The pages the counters above are measured on: one-word links, in a
       footer so they stay clear of the charts. Absolute URLs on the Cloudflare
       host that serves those pages, not this dashboard's host. */
    .source-pages {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 14px;
      /* Pushed to the bottom of the page by the flex column above. */
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid #333;
      font-size: 0.7rem;
    }
    .source-pages a {
      color: #58a6ff;
      text-decoration: none;
    }
    .source-pages a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <footer class="source-pages" aria-label="Measured pages">
    <a href="https://billiards.tailuge.workers.dev/chinese.html" target="_blank" rel="noopener">Chinese</a>

    <a href="https://billiards.tailuge.workers.dev/vietnamese.html" target="_blank" rel="noopener">Vietnamese</a>
    <a href="https://billiards.tailuge.workers.dev/japanese.html" target="_blank" rel="noopener">Japanese</a>

    <a href="https://billiards.tailuge.workers.dev/dutch.html" target="_blank" rel="noopener">Dutch</a>
    <a href="https://billiards.tailuge.workers.dev/snooker.html" target="_blank" rel="noopener">Snooker</a>
    <a href="https://billiards.tailuge.workers.dev/nineball.html" target="_blank" rel="noopener">Nineball</a>
    <a href="https://billiards.tailuge.workers.dev/eightball.html" target="_blank" rel="noopener">Eightball</a>
    <a href="https://billiards.tailuge.workers.dev/threecushion.html" target="_blank" rel="noopener">Three Cushion</a>
    <a href="https://billiards.tailuge.workers.dev/map/index.html" target="_blank" rel="noopener">Map</a>
    <a href="https://billiards.tailuge.workers.dev/reveal/" target="_blank" rel="noopener">Reveal</a>
    <a href="https://billiards.tailuge.workers.dev/challenge/" target="_blank" rel="noopener">Challenge</a>
    <a href="https://billiards.tailuge.workers.dev/lobby" target="_blank" rel="noopener">Lobby</a>

  <script src="https://cdn.plot.ly/plotly-cartesian-3.0.0-rc.0.min.js"
    integrity="sha384-k9BNvphELWyBtQVTUBS5YYM9SAb3H4NoA6hxg6YARuWJqdp+yp8F3mJN405LN+KC"    crossorigin="anonymous"></script>



  <script type="module">
    const GROUPS = [
      {
        id: "lobby-game",
        label: "LOBBY & GAME ACTIVITY",
        // The panel the operators read most often: give the newest month its own
        // third of the width instead of a sliver at the right edge.
        recentSplit: true,
        metrics: [
          { id: "lobby", label: "LOBBY TRAFFIC", color: "#0055ff" },
          { id: "game", label: "GAME ACTIVITY", color: "#9c27b0" },
        ],
      },
      {
        id: "challenges-accepts",
        label: "CHALLENGES & ACCEPTS",
        // Same recent-month emphasis as the lobby panel.
        recentSplit: true,
        metrics: [
          { id: "createTable", label: "CHALLENGES", color: "#ff3e00" },
          { id: "joinTable", label: "ACCEPTS", color: "#4caf50" },
        ],
      },
      {
        id: "games-completed",
        label: "GAMES COMPLETED",
        metrics: [
          { id: "complete", label: "GAMES COMPLETED", color: "#00bcd4" },
        ],
      },
    ]

    const DAY_MS = 24 * 60 * 60 * 1000

    const chartGrid = document.getElementById("chart-grid")

    GROUPS.forEach((group) => {
      if (!document.getElementById(group.id)) {
        const container = document.createElement("div")
        container.id = group.id
        container.className = "chart-container"
        chartGrid.appendChild(container)
      }
    })

    // One fetch feeds every panel on the page: the activity groups, the language
    // chart and the game-blog chart all read the same aggregate response, which
    // the server caches for ten minutes.
    async function loadUsage() {
      try {
        const data = await getData("/api/usage")
        GROUPS.forEach((group) => plotGroup(group, data))
        plotBlogCharts(data)
      } catch (error) {
        console.error(`Could not load usage charts: ${error.message}`)
      }
    }

    async function getData(url) {
      const response = await fetch(url)
      return response.json()
    }

    // Every panel on this page is a Plotly line chart, so the frame, fonts and
    // margins live in one place instead of drifting between libraries.
    const PLOT_CONFIG = { responsive: true, displayModeBar: false }
    const MONO_FONT = "'IBM Plex Mono', monospace"
    const SANS_FONT = "'DM Sans', sans-serif"

    function axisStyle() {
      return {
        gridcolor: "#333",
        linecolor: "#333",
        tickfont: { family: SANS_FONT, size: 9, color: "#999" },
        zeroline: false,
      }
    }

    // Shared frame: title top-left, legend to its right, quarterly date ticks,
    // and the same margins on every panel. The title is pinned to the container
    // rather than left at Plotly's default, which parks it on the top edge of
    // the plot area and leaves the whole top margin empty above it.
    const CHART_MARGIN = { t: 30, r: 12, b: 22, l: 32 }

    function chartLayout(title, overrides = {}) {
      const xaxis = {
        ...axisStyle(),
        type: "date",
        tickangle: 0,
        dtick: "M3",
        tickformat: "%b %Y",
        ...(overrides.xaxis || {}),
      }
      // A split half sets `nticks` instead: a fixed quarterly step crowds the
      // labels once that half's width covers years of history.
      if (overrides.xaxis && "nticks" in overrides.xaxis) delete xaxis.dtick
      return {
        title: {
          text: title,
          font: { family: MONO_FONT, size: 11, color: "#888" },
          x: 0,
          xanchor: "left",
          y: 0.99,
          yref: "container",
          yanchor: "top",
        },
        xaxis,
        yaxis: { ...axisStyle(), rangemode: "tozero", ...(overrides.yaxis || {}) },
        legend: {
          orientation: "h",
          yanchor: "bottom",
          y: 1.02,
          xanchor: "right",
          x: 1,
          font: { family: SANS_FONT, size: 9, color: "#999" },
          bgcolor: "rgba(0,0,0,0)",
        },
        plot_bgcolor: "rgba(0,0,0,0)",
        paper_bgcolor: "rgba(0,0,0,0)",
        margin: CHART_MARGIN,
        autosize: true,
        ...(overrides.extra || {}),
      }
    }

    // `smooth` rounds the corners with Plotly's spline interpolation. Only used
    // where the curve is a state signal (users online); peak-fidelity matters for
    // the byte series, and splines overshoot around spikes.
    //
    // A lone point has no segment to draw, so it is given a marker: otherwise a
    // series with one bucket renders as nothing at all.
    function lineTrace({ label, color, points, axis, xAxis, smooth, showLegend = true }) {
      return {
        x: points.map((point) => point.x),
        y: points.map((point) => point.y),
        name: label,
        type: "scatter",
        showlegend: showLegend,
        mode: points.length === 1 ? "lines+markers" : "lines",
        line: {
          color,
          width: 2,
          dash: "solid",
          ...(smooth ? { shape: "spline", smoothing: 0.6 } : {}),
        },
        marker: { color, size: 6 },
        ...(xAxis ? { xaxis: xAxis } : {}),
        yaxis: axis || "y",
      }
    }

    // Network bytes render as stacked bars rather than a filled line: each hour
    // is a discrete bucket, and bars show the per-hour value directly instead of
    // implying an interpolated total between samples. Dash styling does not apply
    // to bars, so PUBLISH IN is told apart from the outbound series by its grey.
    function barTrace({ label, color, points }) {
      return {
        x: points.map((point) => point.x),
        y: points.map((point) => point.y),
        name: label,
        type: "bar",
        marker: { color },
      }
    }

    // The split panels give the newest 30 days 30% of the width and let all
    // older history share the rest. Plotly has no piecewise time axis, so this
    // is two date axes with independent domains and ranges that share the
    // y-axis; a metric with points on both sides is drawn once per half, and the
    // older half's last point is repeated at the head of the recent half so the
    // line continues across the seam (the repeat sits left of the recent range
    // and is clipped at that boundary).
    const RECENT_WINDOW_MS = 30 * DAY_MS
    const SPLIT_OLDER_SHARE = 0.7
    // The seam gap is 8px. Plotly domains are fractions of the plot area, so
    // splitLayout() converts it using the rendered width.
    const SPLIT_GAP_PX = 8

    // The recent window ends at the newest recorded date rather than today, so a
    // quiet week does not leave an empty strip on the right. A panel with fewer
    // than two points on either side keeps the single continuous axis: splitting
    // a couple of weeks would show the same data at arbitrary widths.
    function panelSplit(series) {
      const dates = []
      series.forEach(({ points }) =>
        points.forEach((point) => dates.push(new Date(point.x).getTime()))
      )
      if (dates.length === 0) return null
      let earliest = Infinity
      let latest = -Infinity
      dates.forEach((date) => {
        if (date < earliest) earliest = date
        if (date > latest) latest = date
      })
      const cutoff = latest - RECENT_WINDOW_MS
      const olderCount = dates.filter((date) => date < cutoff).length
      if (olderCount < 2 || dates.length - olderCount < 2) return null
      return { earliest, cutoff, latest }
    }

    function splitLayout(id, { earliest, cutoff, latest }) {
      const container = document.getElementById(id)
      const plotWidth = container
        ? container.clientWidth - CHART_MARGIN.l - CHART_MARGIN.r
        : 0
      // Domains are fractions of the plot area, so the pixel gap is converted
      // from the width rendered at load; a responsive resize scales it with the
      // container instead of holding it at exactly 8px. The seam is centred on
      // the 70% boundary, so each side gives up half the gap.
      const halfGap = plotWidth > 0 ? SPLIT_GAP_PX / 2 / plotWidth : 0.0075
      return {
        xaxis: {
          domain: [0, SPLIT_OLDER_SHARE - halfGap],
          range: [earliest, cutoff],
          nticks: 5,
        },
        extra: {
          // Two independent date axes make drag-zoom ambiguous, and the mode bar
          // is hidden, so the panel opens with dragging disabled.
          dragmode: false,
          xaxis2: {
            ...axisStyle(),
            type: "date",
            tickangle: 0,
            anchor: "y",
            domain: [SPLIT_OLDER_SHARE + halfGap, 1],
            range: [cutoff, latest],
            dtick: 7 * DAY_MS,
            tickformat: "%d %b",
          },
        },
      }
    }

    function plotGroup(groupConfig, usage) {
      const series = groupConfig.metrics.map((metric) => {
        const key = `${metric.id}Usage`
        return {
          label: metric.label,
          color: metric.color,
          points: (Array.isArray(usage[key]) ? usage[key] : [])
            .map((d) => ({ x: d.date, y: Number(d.count) }))
            .sort((a, b) => new Date(a.x) - new Date(b.x)),
        }
      })

      const split = groupConfig.recentSplit ? panelSplit(series) : null
      const traces = []
      series.forEach(({ label, color, points }) => {
        if (!split) {
          traces.push(lineTrace({ label, color, points }))
          return
        }
        const older = points.filter((point) => new Date(point.x).getTime() < split.cutoff)
        const recent = points.filter((point) => new Date(point.x).getTime() >= split.cutoff)
        // One legend entry per metric: whichever half is drawn first owns it, so
        // a metric that exists only in the recent window is still labelled.
        let inLegend = false
        if (older.length) {
          traces.push(lineTrace({ label, color, points: older }))
          inLegend = true
        }
        if (recent.length) {
          const bridged = older.length ? [older[older.length - 1], ...recent] : recent
          traces.push(
            lineTrace({
              label,
              color,
              points: bridged,
              xAxis: "x2",
              showLegend: !inLegend,
            })
          )
        }
      })

      Plotly.newPlot(
        groupConfig.id,
        traces,
        chartLayout(groupConfig.label, split ? splitLayout(groupConfig.id, split) : {}),
        PLOT_CONFIG
      )
    }

    // Language and game-blog trends, read from the same aggregate response as
    // the activity panels above.
    const langSeries = [
      ["chineseUsage", "Chinese", "#d33"],
      ["koreanUsage", "Korean", "#36c"],
      ["germanUsage", "German", "#393"],
      ["turkishUsage", "Turkish", "#c83"],
      ["vietnameseUsage", "Vietnamese", "#93c"],
      ["japaneseUsage", "Japanese", "#653"],
      ["spanishUsage", "Spanish", "#e67e22"],
      ["dutchUsage", "Dutch", "#0891b2"],
    ]

    const gameSeries = [
      ["snookerUsage", "Snooker", "#8e44ad"],
      ["nineballUsage", "Nine Ball", "#2563eb"],
      ["eightballUsage", "Eight Ball", "#e5e7eb"],
      ["threecushionUsage", "Three Cushion", "#84cc16"],
      ["mapUsage", "Map", "#f39c12"],
      ["revealUsage", "Reveal", "#2dd4bf"],
      ["challengeUsage", "Challenge", "#e11d48"],
    ]

    // Language and game-blog trends: one line per page, aligned to the union of
    // dates so a day a page skipped still dips to zero for it.
    function plotBlogCharts(data) {
      plotBlogChart("lang-chart", "LANGUAGE BLOGS", langSeries, data)
      plotBlogChart("game-chart", "GAME BLOGS", gameSeries, data)
    }

    function plotBlogChart(elementId, title, series, data) {
      const rows = series.flatMap(([key]) =>
        Array.isArray(data[key]) ? data[key].map((item) => item.date) : []
      )
      const dates = [...new Set(rows)].sort()

      const traces = series.map(([key, label, color]) => {
        const counts = new Map(
          (Array.isArray(data[key]) ? data[key] : []).map((item) => [item.date, Number(item.count)])
        )
        return lineTrace({
          label,
          color,
          points: dates.map((date) => ({ x: date, y: counts.get(date) || 0 })),
        })
      })

      Plotly.newPlot(elementId, traces, chartLayout(title), PLOT_CONFIG)
    }

    // Users online and network bytes share one chart. Both series are
    // timestamped and arrival-driven (the server samples nothing on a timer),
    // so one date axis carries both; the byte stack is read on the left axis,
    // the user count on the right.
    function activityLayout(spanMs) {
      const layout = chartLayout("USERS ONLINE & NETWORK (TOTAL Mb / HR)", {
        xaxis: { nticks: 8, tickformat: spanMs > DAY_MS ? "%b %d %H:%M" : "%H:%M" },
        yaxis: {
          // One decimal keeps the labels to four characters (0.5Mb, 12.0Mb),
          // and the smaller tick font keeps them inside the 32px left margin.
          tickformat: ",.1f",
          hoverformat: ",.1f",
          ticksuffix: "Mb",
          tickfont: { family: SANS_FONT, size: 8, color: "#999" },
        },
        extra: {
          // One tooltip per bucket listing every series, so the individual
          // bars can be read alongside the total the stack tops out at.
          hovermode: "x unified",
          // The byte series share each hour's slot, stacked rather than grouped.
          barmode: "stack",
          bargap: 0.05,
          yaxis2: {
            ...axisStyle(),
            overlaying: "y",
            side: "right",
            showgrid: false,
            rangemode: "tozero",
            tickformat: "d",
          },
        },
      })
      // Quarter ticks suit the daily charts; this axis spans minutes to days.
      delete layout.xaxis.dtick
      return layout
    }

    // Presence samples are edge-triggered, so a player reconnecting for a minute
    // shows up as a one-point spike. A centred 3-point moving average softens
    // those (each interior sample becomes the mean of itself and its two
    // neighbours) while passing longer trends through.
    //
    // Only interior points get a full window: the first and last samples have no
    // sample on one side, and averaging the newest one against only its
    // predecessor would drag the live edge backwards. A point whose two
    // neighbours are not both finite numbers is left exactly as recorded rather
    // than turned into NaN. The mean is rounded to one decimal because the
    // counts are whole players and an unrounded mean puts long floats in hover.
    function movingAverage3(points) {
      if (!Array.isArray(points) || points.length < 3) return points
      return points.map((point, index) => {
        if (index === 0 || index === points.length - 1) return point
        const window = [points[index - 1].y, point.y, points[index + 1].y]
        if (!window.every((value) => Number.isFinite(value))) return point
        const mean = (window[0] + window[1] + window[2]) / 3
        return { x: point.x, y: Math.round(mean * 10) / 10 }
      })
    }

    // Presence points exist only for minutes in which the count changed, so they
    // stay sparse: the live count at `ts` extends the line to now. The average is
    // applied to the recorded samples only, then the live count is appended as
    // sent — it is what the server reports now, not a point to smooth.
    function userPoints(data) {
      const samples = (data.samples || []).map(([ts, count]) => ({ x: ts, y: Number(count) }))
      const points = movingAverage3(samples)
      points.push({ x: data.ts, y: Number(data.current) })
      return points
    }

    function renderActivity(users, net) {
      const traces = []
      let min = Infinity
      let max = -Infinity
      const track = (points) =>
        points.forEach((point) => {
          if (point.x < min) min = point.x
          if (point.x > max) max = point.x
        })

      if (users) {
        const points = userPoints(users)
        track(points)
        traces.push(
          lineTrace({
            label: "USERS ONLINE",
            color: "#f59e0b",
            points,
            smooth: true,
            axis: "y2",
          })
        )
      }
      if (net) {
        NET_SERIES.forEach((series) => {
          const points = netSeries(net, series.key)
          track(points)
          traces.push(
            barTrace({ label: series.label, color: series.color, points })
          )
        })
      }

      const spanMs = Number.isFinite(min) ? max - min : 0
      Plotly.newPlot("activity-chart", traces, activityLayout(spanMs), PLOT_CONFIG)
    }

    // Network bytes from the server's in-memory counters. The series are dense
    // (one slot per minute) and start at process start, so the x values are
    // generated from `start`. API bytes are counted before gzip; Nchan
    // WebSocket frames are not compressed at all, so only the API line is
    // inflated relative to the wire.
    function formatBytes(value) {
      if (!value) return "0 B"
      const units = ["B", "KB", "MB", "GB"]
      let index = 0
      let size = Number(value)
      while (size >= 1024 && index < units.length - 1) {
        size /= 1024
        index += 1
      }
      return `${size < 10 && index > 0 ? size.toFixed(1) : Math.round(size)} ${units[index]}`
    }

    const NET_SERIES = [
      { key: "presence.out", label: "PRESENCE OUT", color: "#0055ff" },
      { key: "table.out", label: "TABLE OUT", color: "#9c27b0" },
      { key: "api.out", label: "API OUT", color: "#00bcd4" },
      { key: "in", label: "PUBLISH IN", color: "#888" },
    ]

    // The minute slots are accumulated into one-hour buckets, aligned to a round
    // epoch boundary so a bucket covers the same wall-clock window on every page
    // load (anchoring to `start` would move the buckets on each restart). Partial
    // buckets at the window edges are kept rather than dropped: the first holds
    // only the minutes since process start and the last the current hour so far,
    // and discarding them would leave a short-lived process with no line at all.
    // Values are returned in MB (1024 * 1024 bytes), the unit the left axis is in.
    const NET_BUCKET_MS = 60 * 60 * 1000

    // `data.start` is the first minute of the window, one slot per minute.
    function netSeries(data, key) {
      const series = data.series || {}
      const blank = () => new Array(data.minutes).fill(0)
      let values
      if (key === "in") {
        const presence = series["presence.in"] || blank()
        const table = series["table.in"] || blank()
        values = presence.map((value, index) => value + (table[index] || 0))
      } else {
        values = series[key] || blank()
      }
      const buckets = new Map()
      values.forEach((value, index) => {
        const minute = data.start + index * 60000
        const x = Math.floor(minute / NET_BUCKET_MS) * NET_BUCKET_MS
        buckets.set(x, (buckets.get(x) || 0) + value)
      })

      return [...buckets.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([x, bytes]) => ({ x, y: bytes / (1024 * 1024) }))
    }

    // The busiest API routes over the same window as the chart, as four
    // columns: route, bytes, calls, bytes per call.
    //
    // Nchan is not an API route, so it closes the table as a single row built
    // from the outbound channel bytes the chart already plots. Nothing counts
    // publishes per channel, so its call columns stay blank rather than guessed.
    function renderRoutes(routes, series = {}) {
      const body = document.getElementById("net-routes")
      body.textContent = ""
      const measured = (routes || []).filter((route) => route.bytes > 0)
      const top = measured.slice(0, 6)
      // The match-results port answers a few hundred bytes per upload, so a table
      // ranked purely by bytes would never show it while bigger routes are live.
      // Keep its row visible whenever it is measured, outside the top-six cut.
      measured.forEach((route) => {
        if (route.route === "match-results" && top.indexOf(route) === -1) {
          top.push(route)
        }
      })
      const nchanBytes = ["presence.out", "table.out"].reduce(
        (sum, key) =>
          sum + (series[key] || []).reduce((total, value) => total + value, 0),
        0
      )
      if (top.length === 0 && !nchanBytes) {
        const empty = body.insertRow().insertCell()
        empty.colSpan = 4
        empty.textContent = "nothing recorded yet"
        return
      }
      top.forEach((route) => {
        const row = body.insertRow()
        const name = document.createElement("span")
        name.className = "net-route-name"
        name.textContent = route.calls ? `/api/${route.route}` : route.route
        row.insertCell().appendChild(name)
        row.insertCell().textContent = formatBytes(route.bytes)
        row.insertCell().textContent = route.calls
        row.insertCell().textContent = route.calls
          ? formatBytes(route.bytes / route.calls)
          : "–"
      })
      if (nchanBytes) {
        const row = body.insertRow()
        const name = document.createElement("span")
        name.className = "net-route-name"
        name.textContent = "/nchan/"
        row.insertCell().appendChild(name)
        row.insertCell().textContent = formatBytes(nchanBytes)
        row.insertCell().textContent = "–"
        row.insertCell().textContent = "–"
      }
    }

    // Both endpoints report since the server process started, so the two lines
    // always cover the same window. Loaded once per visit: this page does not
    // poll or refresh on its own.
    async function loadActivity() {
      const [users, net] = await Promise.allSettled([
        getData("/api/presence/history"),
        getData("/api/net/history"),
      ])
      if (users.status === "rejected") {
        console.error("Could not load users-online history:", users.reason)
      }
      if (net.status === "rejected") {
        console.error("Could not load network history:", net.reason)
      }
      renderActivity(
        users.status === "fulfilled" ? users.value : null,
        net.status === "fulfilled" ? net.value : null
      )
      if (net.status === "fulfilled") renderRoutes(net.value.routes, net.value.series)
    }

    // Canonical page label for the referrers-by-page table. The same page is
    // reported under several paths (the GitHub Pages folder the client is
    // served from, an explicit .html file, an index page name), so those are
    // dropped: /billiards/dist/map/index.html reads as /map/.
    function canonicalPage(page) {
      let path = String(page)
      if (path.indexOf("/billiards/dist") === 0) {
        path = path.slice("/billiards/dist".length)
      }
      if (path.endsWith(".html")) path = path.slice(0, -".html".length)
      // Removed after the suffix so /map/index.html leaves the trailing slash.
      path = path.replace(/index$/, "")
      return path || "/"
    }

    function referrerHref(ref) {
      try {
        const url = new URL(ref)
        return url.protocol === "http:" || url.protocol === "https:" ? url.href : null
      } catch (error) {
        return null
      }
    }

    // Referrer sites over the server's 3d cache, with our own hosts (the
    // Cloudflare site and the Render deployment) already excluded and the
    // high-volume sources rolled up to their root (see referrer_api in
    // docker/nchan_meta.js). There is no history behind it, so this is a table
    // rather than another line chart.
    async function loadReferrers() {
      const body = document.getElementById("referrer-rows")
      let rows = []
      try {
        const data = await getData("/api/referrers")
        rows = Array.isArray(data.referrers) ? data.referrers : []
      } catch (error) {
        console.error(`Could not load referrer sites: ${error.message}`)
      }
      body.textContent = ""
      if (rows.length === 0) {
        const empty = body.insertRow().insertCell()
        empty.colSpan = 2
        empty.textContent = "nothing recorded yet"
        return
      }
      rows.forEach((row) => {
        const tr = body.insertRow()
        tr.insertCell().textContent = row.count
        // The referrer is the page the visitor came from, so it links to that
        // page. `noreferrer` keeps this dashboard's address out of the target's
        // Referer header (and implies noopener); `nofollow` asks search engines
        // not to credit the link. A ref that is not http(s) (e.g. an app scheme)
        // stays plain text rather than becoming a dead link.
        const link = referrerHref(row.ref)
          ? document.createElement("a")
          : document.createElement("span")
        link.className = "referrer-name"
        link.textContent = row.ref
        if (link.tagName === "A") {
          link.href = referrerHref(row.ref)
          link.target = "_blank"
          link.rel = "noreferrer noopener nofollow"
        }
        tr.insertCell().appendChild(link)
      })
    }

    // Referrers grouped by the page that reported them. The page sends its own
    // document.referrer to POST /api/referrer (reportPageReferrer in utils.js),
    // so this is the one view that knows which page got the visit. In-memory
    // since process start, so totals rather than a time series.
    async function loadPageReferrers() {
      const body = document.getElementById("page-referrer-rows")
      let pages = []
      try {
        const data = await getData("/api/referrers/pages")
        pages = Array.isArray(data.pages) ? data.pages : []
      } catch (error) {
        console.error(`Could not load page referrers: ${error.message}`)
      }
      body.textContent = ""
      pages = pages.filter(
        (page) => Array.isArray(page.refs) && page.refs.length > 0
      )
      if (pages.length === 0) {
        const empty = body.insertRow().insertCell()
        empty.colSpan = 3
        empty.textContent = "nothing recorded yet"
        return
      }
      pages.forEach((page) => {
        page.refs.forEach((row, index) => {
          const tr = body.insertRow()
          tr.insertCell().textContent = row.count
          // One page label spans its group of sources.
          if (index === 0) {
            const pageCell = tr.insertCell()
            pageCell.rowSpan = page.refs.length
            pageCell.className = "page-name"
            pageCell.textContent = canonicalPage(page.page)
          }
          const link = referrerHref(row.ref)
            ? document.createElement("a")
            : document.createElement("span")
          link.className = "referrer-name"
          link.textContent = row.ref
          if (link.tagName === "A") {
            link.href = referrerHref(row.ref)
            link.target = "_blank"
            link.rel = "noreferrer noopener nofollow"
          }
          tr.insertCell().appendChild(link)
        })
      })
    }

    loadUsage()
    loadActivity()
    loadReferrers()
    loadPageReferrers()
  </script>
</body>

</html>
