<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Terminal: Usage</title>
  <meta name="description" content="A dashboard for monitoring usage metrics." />
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: "IBM Plex Mono", monospace;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .title {
      font-size: 1.5rem;
      margin: 0;
    }
    .server-stats-links a {
      color: #58a6ff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.8rem;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
    }
    .chart-container {
      background-color: #111;
      border: 1px solid #333;
      padding: 10px;
      height: 400px;
    }
    .chart-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .chart-panel {
      background-color: #111;
      border: 1px solid #333;
      padding: 10px;
      height: 400px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chart-panel-title {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .chart-canvas {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    /* The pages the counters above are measured on: one-word links, in a
       footer so they stay clear of the charts. Absolute URLs on the Cloudflare
       host that serves those pages, not this dashboard's host. */
    .source-pages {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 14px;
      margin-top: 20px;
      border-top: 1px solid #333;
      padding-top: 10px;
      font-size: 0.7rem;
    }
    .source-pages a {
      color: #58a6ff;
      text-decoration: none;
    }
    .source-pages a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header class="header">
    <h1 class="title">USAGE</h1>
    <div class="server-stats-links">
      <a href="https://vercel.com/tailuges-projects/~/usage" target="_blank">VERCEL</a>
      <a href="https://dashboard.render.com/web/srv-ctk5bmtds78s73eteil0/metrics" target="_blank">RENDER</a>
    </div>
  </header>
  <main id="chart-grid" class="chart-grid">
    <div id="lobby-game" class="chart-container"></div>
    <div id="challenges-accepts" class="chart-container"></div>
    <div id="games-completed" class="chart-container"></div>
  </main>

  <section class="chart-section">
    <div class="chart-panel">
      <h2 class="chart-panel-title">Language Blogs</h2>
      <div class="chart-canvas">
        <canvas id="lang-chart" aria-label="Usage by language"></canvas>
      </div>
    </div>
    <div class="chart-panel">
      <h2 class="chart-panel-title">Game Blogs</h2>
      <div class="chart-canvas">
        <canvas id="game-chart" aria-label="Usage by game type"></canvas>
      </div>
    </div>
    <div class="chart-panel">
      <h2 class="chart-panel-title">Users Online</h2>
      <div class="chart-canvas">
        <canvas id="users-chart" aria-label="Users online over time"></canvas>
      </div>
    </div>
  </section>

  <footer class="source-pages" aria-label="Measured pages">
    <a href="https://billiards.tailuge.workers.dev/chinese.html" target="_blank" rel="noopener">Chinese</a>
    <a href="https://billiards.tailuge.workers.dev/korean.html" target="_blank" rel="noopener">Korean</a>
    <a href="https://billiards.tailuge.workers.dev/german.html" target="_blank" rel="noopener">German</a>
    <a href="https://billiards.tailuge.workers.dev/turkish.html" target="_blank" rel="noopener">Turkish</a>
    <a href="https://billiards.tailuge.workers.dev/vietnamese.html" target="_blank" rel="noopener">Vietnamese</a>
    <a href="https://billiards.tailuge.workers.dev/japanese.html" target="_blank" rel="noopener">Japanese</a>
    <a href="https://billiards.tailuge.workers.dev/spanish.html" target="_blank" rel="noopener">Spanish</a>
    <a href="https://billiards.tailuge.workers.dev/dutch.html" target="_blank" rel="noopener">Dutch</a>
    <a href="https://billiards.tailuge.workers.dev/snooker.html" target="_blank" rel="noopener">Snooker</a>
    <a href="https://billiards.tailuge.workers.dev/nineball.html" target="_blank" rel="noopener">Nineball</a>
    <a href="https://billiards.tailuge.workers.dev/eightball.html" target="_blank" rel="noopener">Eightball</a>
    <a href="https://billiards.tailuge.workers.dev/map/index.html" target="_blank" rel="noopener">Map</a>
    <a href="https://billiards.tailuge.workers.dev/reveal/" target="_blank" rel="noopener">Reveal</a>
    <a href="https://billiards.tailuge.workers.dev/lobby" target="_blank" rel="noopener">Lobby</a>
    <a href="https://billiards.tailuge.workers.dev/" target="_blank" rel="noopener">Game</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>

  <script src="https://cdn.plot.ly/plotly-cartesian-3.0.0-rc.0.min.js"
    integrity="sha384-k9BNvphELWyBtQVTUBS5YYM9SAb3H4NoA6hxg6YARuWJqdp+yp8F3mJN405LN+KC"
    crossorigin="anonymous"></script>

  <script type="module">
    const GROUPS = [
      {
        id: "lobby-game",
        label: "LOBBY & GAME ACTIVITY",
        metrics: [
          { id: "lobby", label: "LOBBY TRAFFIC", color: "#0055ff" },
          { id: "game", label: "GAME ACTIVITY", color: "#9c27b0" },
        ],
      },
      {
        id: "challenges-accepts",
        label: "CHALLENGES & ACCEPTS",
        metrics: [
          { id: "createTable", label: "CHALLENGES", color: "#ff3e00" },
          { id: "joinTable", label: "ACCEPTS", color: "#4caf50" },
        ],
      },
      {
        id: "games-completed",
        label: "GAMES COMPLETED",
        metrics: [
          { id: "complete", label: "GAMES COMPLETED", color: "#00bcd4" },
        ],
      },
    ]

    // CHALLENGES & ACCEPTS is plotted as a trailing mean so day-to-day noise
    // doesn't hide the trend. Every other panel is plotted raw.
    const SMOOTHED_GROUP_ID = "challenges-accepts"
    const SMOOTHING_WINDOW = 3
    const DAY_MS = 24 * 60 * 60 * 1000

    const chartGrid = document.getElementById("chart-grid")

    GROUPS.forEach((group) => {
      if (!document.getElementById(group.id)) {
        const container = document.createElement("div")
        container.id = group.id
        container.className = "chart-container"
        chartGrid.appendChild(container)
      }
    })

    // One fetch feeds every panel on the page: the Plotly groups, the language
    // chart and the game-blog chart all read the same aggregate response, which
    // the server caches for an hour.
    async function loadUsage() {
      try {
        const data = await getData("/api/usage")
        GROUPS.forEach((group) => plotGroup(group, data))
        plotUsageCharts(data)
      } catch (error) {
        console.error(`Could not load usage charts: ${error.message}`)
      }
    }

    async function getData(url) {
      const response = await fetch(url)
      return response.json()
    }

    // Days with no activity are absent from the store, so insert explicit
    // zero counts — otherwise a "3 day" mean would span three active days.
    function fillMissingDays(data) {
      if (data.length === 0) return data

      const countByDate = new Map(data.map((d) => [d.date, d.count]))
      const filled = []
      const start = new Date(data[0].date).getTime()
      const end = new Date(data[data.length - 1].date).getTime()

      for (let time = start; time <= end; time += DAY_MS) {
        const date = new Date(time).toISOString().split("T")[0]
        filled.push({ date, count: countByDate.get(date) ?? 0 })
      }

      return filled
    }

    function movingAverage(data, window) {
      const filled = fillMissingDays(data)

      return filled.map((point, index) => {
        const slice = filled.slice(Math.max(0, index - window + 1), index + 1)
        const total = slice.reduce((sum, d) => sum + Number(d.count), 0)
        return { date: point.date, count: total / slice.length }
      })
    }

    function plotGroup(groupConfig, usage) {
      const traces = groupConfig.metrics.map((metric) => {
        const key = `${metric.id}Usage`
        const data = (Array.isArray(usage[key]) ? usage[key] : [])
          .map((d) => ({ date: d.date, count: Number(d.count) }))
          .sort((a, b) => new Date(a.date) - new Date(b.date))

        const points =
          groupConfig.id === SMOOTHED_GROUP_ID
            ? movingAverage(data, SMOOTHING_WINDOW)
            : data

        return {
          x: points.map((d) => d.date),
          y: points.map((d) => d.count),
          name: metric.label,
          type: "scatter",
          mode: "lines",
          line: { color: metric.color, width: 2 },
        }
      })

      const layout = {
        title: {
          text: groupConfig.label,
          font: {
            family: "'IBM Plex Mono', monospace",
            size: 11,
            color: "#888",
          },
          x: 0,
          xanchor: "left",
        },
        xaxis: {
          type: "date",
          tickangle: 0,
          dtick: "M3",
          tickformat: "%b %Y",
          gridcolor: "#333",
          linecolor: "#333",
          tickfont: {
            family: "'DM Sans', sans-serif",
            size: 9,
            color: "#999",
          },
          zeroline: false,
        },
        yaxis: {
          gridcolor: "#333",
          linecolor: "#333",
          tickfont: {
            family: "'DM Sans', sans-serif",
            size: 9,
            color: "#999",
          },
          zeroline: false,
        },
        legend: {
          orientation: "h",
          yanchor: "bottom",
          y: 1.02,
          xanchor: "right",
          x: 1,
          font: {
            family: "'DM Sans', sans-serif",
            size: 9,
            color: "#999",
          },
          bgcolor: "rgba(0,0,0,0)",
        },
        plot_bgcolor: "rgba(0,0,0,0)",
        paper_bgcolor: "rgba(0,0,0,0)",
        margin: { t: 50, r: 20, b: 40, l: 30 },
        autosize: true,
      }

      const config = {
        responsive: true,
        displayModeBar: false,
        staticPlot: false,
      }

      Plotly.newPlot(groupConfig.id, traces, layout, config)
    }

    // Language and game-blog trends, read from the same aggregate response as
    // the activity panels above.
    const langSeries = [
      ["chineseUsage", "Chinese", "#d33"],
      ["koreanUsage", "Korean", "#36c"],
      ["germanUsage", "German", "#393"],
      ["turkishUsage", "Turkish", "#c83"],
      ["vietnameseUsage", "Vietnamese", "#93c"],
      ["japaneseUsage", "Japanese", "#653"],
      ["spanishUsage", "Spanish", "#e67e22"],
      ["dutchUsage", "Dutch", "#0891b2"],
    ]

    const gameSeries = [
      ["snookerUsage", "Snooker", "#8e44ad"],
      ["nineballUsage", "Nine Ball", "#2563eb"],
      ["eightballUsage", "Eight Ball", "#e5e7eb"],
      ["mapUsage", "Map", "#f39c12"],
      ["revealUsage", "Reveal", "#2dd4bf"],
    ]

    function valuesByDate(values) {
      return Object.fromEntries(values.map((item) => [item.date, item.count]))
    }

    function makeDates(data, series) {
      return [...new Set(series.flatMap(([key]) =>
        Array.isArray(data[key]) ? data[key].map((item) => item.date) : []
      ))].sort()
    }

    function makeDatasets(data, series, dates) {
      return series.map(([key, label, color]) => {
        const values = valuesByDate(Array.isArray(data[key]) ? data[key] : [])
        return {
          label,
          data: dates.map((date) => values[date] || 0),
          borderColor: color,
          backgroundColor: color,
          tension: 0,
        }
      })
    }

    // The language and game-blog charts have one x label per day, which crowds
    // the axis. Keep every data point but only label (and grid) quarter starts,
    // so the dates tick every 3 months.
    const quarterlyAxis = {
      ticks: { color: "#777", font: { size: 10 } },
      grid: { color: "#222" },
      afterBuildTicks(axis) {
        const all = axis.ticks
        const quarterly = all.filter((tick) =>
          new Date(`${tick.label}T00:00:00Z`).getUTCMonth() % 3 === 0
        )
        // A short range may not contain a quarter start; fall back to the ends.
        axis.ticks = quarterly.length
          ? quarterly
          : all.filter((_, index) => index === 0 || index === all.length - 1)
      },
    }

    const chartDefaults = {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      // Lines only, matching the Plotly panels: no markers at data values.
      elements: { point: { radius: 0 } },
      plugins: {
        legend: {
          labels: {
            color: "#999",
            boxWidth: 10,
            font: { size: 9 },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: "#777", font: { size: 10 } },
          grid: { color: "#222" },
        },
        y: {
          beginAtZero: true,
          ticks: { color: "#777", font: { size: 10 } },
          grid: { color: "#222" },
        },
      },
    }

    function plotUsageCharts(data) {
      const langDates = makeDates(data, langSeries)
      const gameDates = makeDates(data, gameSeries)

      new Chart(document.getElementById("lang-chart"), {
        type: "line",
        data: {
          labels: langDates,
          datasets: makeDatasets(data, langSeries, langDates),
        },
        options: {
          ...chartDefaults,
          scales: { ...chartDefaults.scales, x: quarterlyAxis },
        },
      })

      new Chart(document.getElementById("game-chart"), {
        type: "line",
        data: {
          labels: gameDates,
          datasets: makeDatasets(data, gameSeries, gameDates),
        },
        options: {
          ...chartDefaults,
          scales: { ...chartDefaults.scales, x: quarterlyAxis },
        },
      })
    }

    // Users online is sampled only when the count changes, so the points are
    // unevenly spaced: a linear time axis keeps the gaps honest without pulling
    // in a date adapter.
    const usersChart = new Chart(document.getElementById("users-chart"), {
      type: "line",
      data: {
        datasets: [
          {
            label: "USERS ONLINE",
            data: [],
            borderColor: "#00bcd4",
            backgroundColor: "#00bcd4",
            tension: 0,
          },
        ],
      },
      options: {
        ...chartDefaults,
        scales: {
          x: {
            type: "linear",
            ticks: {
              color: "#777",
              font: { size: 10 },
              callback: (value) => new Date(value).toTimeString().slice(0, 5),
            },
            grid: { color: "#222" },
          },
          y: chartDefaults.scales.y,
        },
      },
    })

    // Loaded once per visit: this page does not poll or refresh on its own, so
    // the charts stay as they were when the page was opened.
    async function loadUsersOnline() {
      try {
        const data = await getData("/api/presence/history")
        const raw = data.samples.map(([ts, count]) => ({ x: ts, y: Number(count) }))
        raw.push({ x: data.ts, y: Number(data.current) })

        // Same trailing mean as the CHALLENGES & ACCEPTS panel, so single-step
        // blips in the presence count don't dominate the shape of the line.
        const points = raw.map((point, index) => {
          const slice = raw.slice(Math.max(0, index - SMOOTHING_WINDOW + 1), index + 1)
          const total = slice.reduce((sum, d) => sum + d.y, 0)
          return { x: point.x, y: total / slice.length }
        })

        usersChart.data.datasets[0].data = points
        usersChart.update("none")
      } catch (error) {
        console.error(`Could not load users-online history: ${error.message}`)
      }
    }

    loadUsage()
    loadUsersOnline()
  </script>
</body>

</html>
