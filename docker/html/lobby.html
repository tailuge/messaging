<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>
</head>
<body>
    <lobby-app></lobby-app>

    <script type="module">
        import { LitElement, html, css } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';
        import { MessagingClient, canChallenge, canSpectate } from 'https://unpkg.com/@tailuge/messaging';

        // ── Constants ──────────────────────────────────────────────────────

        const GAMES = [
            { label: "Eight Ball",    img: "assets/eightball.png" },
            { label: "Nine Ball",     img: "assets/nineball.png" },
            { label: "Snooker",       img: "assets/snooker.png" },
            { label: "3-Cushion", img: "assets/threecushion.png" },
            { label: "Trickshot",      img: "assets/practice.png" },
        ];

        const SHARED_STYLES = css`
            button { cursor: pointer; padding: 0.15rem 0.4rem; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 0.75rem; transition: background-color 0.2s, opacity 0.2s; }
            button:hover { background-color: #f0f0f0; }
            button:active { background-color: #e0e0e0; }
            button:focus-visible { outline: 2px solid #007bff; outline-offset: 2px; }
            .btn-challenge { background: #007bff; color: #fff; border-color: #007bff; }
            .btn-challenge:hover { background: #0069d9; border-color: #0062cc; }
            .btn-spectate  { background: #fd7e14; color: #fff; border-color: #fd7e14; }
            .btn-spectate:hover { background: #e36e0b; border-color: #d6660a; }
            .btn-chat      { background: #6c757d; color: #fff; border-color: #6c757d; }
            .btn-chat:hover { background: #5a6268; border-color: #545b62; }
            .btn-accept    { background: #28a745; color: #fff; border-color: #28a745; }
            .btn-accept:hover { background: #218838; border-color: #1e7e34; }
            .btn-decline   { background: #dc3545; color: #fff; border-color: #dc3545; }
            .btn-decline:hover { background: #c82333; border-color: #bd2130; }
            .btn-leave     { background: #6c757d; color: #fff; border-color: #6c757d; }
            .btn-leave:hover { background: #5a6268; border-color: #545b62; }
        `;

        // ── Helpers ────────────────────────────────────────────────────────

        const flag = (code) => code
            ? [...code.toUpperCase()].map(c => String.fromCodePoint(0x1F1E6 - 65 + c.charCodeAt(0))).join('')
            : '🌐';

        const gameUrl = ({ tableId, userId, userName, ruleType, spectating, isFirst, options }) => {
            let url = `https://billiards.tailuge.workers.dev/?websocketserver=wss://billiards.onrender.com/ws`
                + `&tableId=${tableId}&name=${encodeURIComponent(userName)}&clientId=${userId}&ruletype=${ruleType}`;
            if (spectating) url += '&spectator=true';
            else if (isFirst) url += '&first=true';
            if (options) Object.entries(options).forEach(([k, v]) => url += `&${k}=${encodeURIComponent(v)}`);
            return url;
        };

        const INITIAL_STATE = {
            connected: false,
            users: [],
            challenges: {}, // indexed by other player's ID
            currentMatch: null, // { tableId, ruleType, spectating, isFirst }
            activeChat: null
        };

        function reduce(state, action) {
            switch (action.type) {
                case 'CONNECTED':
                    return { ...state, connected: action.payload };
                case 'USERS_UPDATE':
                    return { ...state, users: action.payload };
                case 'CHALLENGE_SENT':
                    return {
                        ...state,
                        challenges: {
                            ...state.challenges,
                            [action.payload.recipientId]: { ...action.payload, status: 'pending' }
                        }
                    };
                case 'CHALLENGE_MSG': {
                    const msg = action.payload;
                    const { myId } = action;
                    const challenges = { ...state.challenges };
                    if (msg.type === 'offer') {
                        const existing = challenges[msg.challengerId];
                        if (!existing || existing.tableId !== msg.tableId) {
                            challenges[msg.challengerId] = { ...msg, status: 'pending' };
                        }
                    } else if (msg.type === 'accept') {
                        if (state.currentMatch) return state;
                        const otherId = msg.challengerId === myId ? msg.recipientId : msg.challengerId;
                        if (challenges[otherId] && challenges[otherId].tableId === msg.tableId) {
                            delete challenges[otherId];
                        }
                        // Enter the match based on whether we sent or received the acceptance
                        if (msg.recipientId === myId) {
                            return {
                                ...state,
                                challenges,
                                currentMatch: { tableId: msg.tableId, ruleType: msg.ruleType, options: msg.options, spectating: false, isFirst: false }
                            };
                        } else if (msg.challengerId === myId) {
                            return {
                                ...state,
                                challenges,
                                currentMatch: { tableId: msg.tableId, ruleType: msg.ruleType, options: msg.options, spectating: false, isFirst: true }
                            };
                        }
                    } else if (msg.type === 'decline' || msg.type === 'cancel') {
                        const otherId = msg.challengerId === myId ? msg.recipientId : msg.challengerId;
                        if (challenges[otherId]) {
                            if (msg.type === 'decline' && challenges[otherId].recipientId === otherId) {
                                challenges[otherId] = { ...challenges[otherId], status: 'declined' };
                            } else {
                                delete challenges[otherId];
                            }
                        }
                    }
                    return { ...state, challenges };
                }
                case 'CHALLENGE_TIMEOUT':
                    if (state.challenges[action.payload]?.status === 'pending') {
                        return {
                            ...state,
                            challenges: {
                                ...state.challenges,
                                [action.payload]: { ...state.challenges[action.payload], status: 'timeout' }
                            }
                        };
                    }
                    return state;
                case 'CHALLENGE_DISMISS': {
                    const challenges = { ...state.challenges };
                    delete challenges[action.payload];
                    return { ...state, challenges };
                }
                case 'MATCH_SET':
                    return { ...state, currentMatch: action.payload };
                case 'MATCH_LEAVE':
                    return { ...state, currentMatch: null };
                case 'CHAT_MSG':
                    return { ...state, activeChat: action.payload };
                case 'CHAT_DISMISS':
                    return { ...state, activeChat: null };
                default:
                    return state;
            }
        }

        // ── Controller (networking + state) ───────────────────────────────

        class LobbyController {
            // ReactiveController lifecycle
            host; _lobby = null; _table = null; _challengeTimers = new Map();

            // State derived via getters
            state = { ...INITIAL_STATE };

            get connected() { return this.state.connected; }
            get users() { return this.state.users; }
            get activeChat() { return this.state.activeChat; }
            get tableId() { return this.state.currentMatch?.tableId; }
            get ruleType() { return this.state.currentMatch?.ruleType || 'standard'; }
            get spectating() { return !!this.state.currentMatch?.spectating; }
            get isFirst() { return !!this.state.currentMatch?.isFirst; }
            get matchOptions() { return this.state.currentMatch?.options; }

            get activeChallenge() {
                return Object.values(this.state.challenges)
                    .find(c => c.recipientId === this.myId && c.status === 'pending');
            }
            get sentChallenge() {
                return Object.values(this.state.challenges)
                    .find(c => c.challengerId === this.myId);
            }

            constructor(host) {
                const p = new URLSearchParams(location.search);
                this.myId   = p.get('id')   || 'user-' + Math.random().toString(36).slice(2, 7);
                this.myName = p.get('name') || 'Player';

                let baseUrl = 'https://billiards-network.onrender.com';
                if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                    const protocol = location.protocol === 'https:' ? 'https:' : 'http:';
                    baseUrl = `${protocol}//${location.host}`;
                }

                this._client = new MessagingClient({ baseUrl });
                (this.host = host).addController(this);
            }

            dispatch(action) {
                this.state = reduce(this.state, { ...action, myId: this.myId });
                this.host.requestUpdate();
            }

            // Called by Lit when the host connects to the DOM
            async hostConnected() {
                try { await this._connect(); }
                catch (e) { console.error('Lobby connect failed:', e); }
            }

            hostDisconnected() {
                this._clearAllChallengeTimers();
                this._lobby?.leave();
            }

            async _connect() {
                this._lobby = await this._client.joinLobby({
                    messageType: 'presence', type: 'join',
                    userId: this.myId, userName: this.myName,
                });
                this.dispatch({ type: 'CONNECTED', payload: true });

                this._lobby.onUsersChange(users => {
                    this.dispatch({ type: 'USERS_UPDATE', payload: users });
                });

                this._lobby.onChallenge(msg => {
                    console.log('challenge msg:', JSON.stringify(msg, null, 2));
                    this._clearTimerFor(msg.challengerId === this.myId ? msg.recipientId : msg.challengerId);
                    this.dispatch({ type: 'CHALLENGE_MSG', payload: msg });
                });

                this._lobby.onChat(msg => {
                    this.dispatch({ type: 'CHAT_MSG', payload: msg });
                });
            }

            async challenge(userId, ruleType, options) {
                const u = this.users.find(u => u.userId === userId);
                const tableId = await this._lobby.challenge(userId, ruleType, undefined, options);
                const payload = { challengerId: this.myId, recipientId: userId, recipientName: u?.userName || userId, ruleType, options, tableId };
                console.log('challenge sent:', JSON.stringify(payload, null, 2));
                this.dispatch({ type: 'CHALLENGE_SENT', payload });

                const timerId = setTimeout(() => {
                    this.dispatch({ type: 'CHALLENGE_TIMEOUT', payload: userId });
                    this._challengeTimers.delete(userId);
                }, 30000);
                this._challengeTimers.set(userId, timerId);
            }

            async cancelChallenge() {
                const s = this.sentChallenge;
                if (s?.status === 'pending') {
                    await this._lobby.cancelChallenge(s.recipientId, s.ruleType);
                    this.clearSentChallenge();
                }
            }

            clearSentChallenge() {
                const s = this.sentChallenge;
                if (s) {
                    this._clearTimerFor(s.recipientId);
                    this.dispatch({ type: 'CHALLENGE_DISMISS', payload: s.recipientId });
                }
            }

            _clearTimerFor(userId) {
                const t = this._challengeTimers.get(userId);
                if (t) {
                    clearTimeout(t);
                    this._challengeTimers.delete(userId);
                }
            }

            _clearAllChallengeTimers() {
                for (const timerId of this._challengeTimers.values()) clearTimeout(timerId);
                this._challengeTimers.clear();
            }

            async acceptChallenge() {
                const c = this.activeChallenge;
                this._table = await this._lobby.acceptChallenge(c.challengerId, c.ruleType, c.tableId);
                this.dispatch({
                    type: 'MATCH_SET',
                    payload: { tableId: c.tableId, ruleType: c.ruleType, options: c.options, spectating: false, isFirst: false }
                });
            }

            async declineChallenge() {
                const c = this.activeChallenge;
                await this._lobby.declineChallenge(c.challengerId, c.ruleType);
                this.dispatch({ type: 'CHALLENGE_DISMISS', payload: c.challengerId });
            }

            async spectate(tableId, ruleType) {
                this._table = await this._client.joinTable(tableId, this.myId);
                this.dispatch({
                    type: 'MATCH_SET',
                    payload: { tableId, ruleType: ruleType || 'standard', spectating: true, isFirst: false }
                });
            }

            async leaveGame() {
                if (this._table) { await this._table.leave(); this._table = null; }
                await this._lobby.updatePresence({ tableId: undefined });
                this.dispatch({ type: 'MATCH_LEAVE' });
            }

            sendChat(recipientId, text) {
                this._lobby.sendChat(recipientId, text);
            }
        }

        // ── UI Components ──────────────────────────────────────────────────

        class UserList extends LitElement {
            static properties = {
                users:   { type: Array },
                myId:    { type: String },
                tableId: { type: String },
                isChallengePending: { type: Boolean },
            };
            static styles = [SHARED_STYLES, css`
                :host { display: block; }
                ul { list-style: none; margin: 0; padding: 0; max-height: 160px; overflow-y: auto; }
                li { display: flex; justify-content: space-between; align-items: center; padding: 0.15rem 0; border-bottom: 1px solid #f0f0f0; gap: 0.25rem; }
                li:last-child { border-bottom: none; }
                .user-info { display: flex; flex-direction: column; }
                .user-name { font-weight: 500; font-size: 0.85rem; }
                .user-status { font-size: 0.7rem; color: #888; }
                .actions { display: flex; gap: 0.2rem; flex-shrink: 0; }
            `];

            render() {
                const others = (this.users || []).filter(u => u.userId !== this.myId);
                if (others.length === 0) {
                    return html`<div style="padding: 1rem; text-align: center; color: #888; font-style: italic; font-size: 0.8rem;">
                        No other players online yet. Invite a friend!
                    </div>`;
                }
                return html`<ul>${others.map(u => this._row(u))}</ul>`;
            }

            _row(u) {
                const isMe   = u.userId === this.myId;
                const status = u.tableId ? '🎱 in game' : u.seek ? '🔍 seeking' : '✓ available';
                let actions  = html``;
                if (!isMe) {
                    if (canSpectate(u, this.tableId)) {
                        actions = html`<button class="btn-spectate" aria-label="Spectate ${u.userName}" @click=${() => this._emit('spectate', { tableId: u.tableId, ruleType: u.ruleType })}>Spectate</button>`;
                    } else if (canChallenge(u, this.myId)) {
                        actions = html`<button class="btn-challenge" aria-label="Challenge ${u.userName}" ?disabled=${this.isChallengePending} @click=${() => this._emit('challenge', u.userId)}>Challenge</button>`;
                    }
                }
                return html`
                    <li>
                        <div class="user-info">
                            <span class="user-name">${flag(u.meta?.country)} ${u.userName}${isMe ? ' (you)' : ''}</span>
                        </div>
                        <div class="actions">${actions}</div>
                    </li>`;
            }

            _emit(type, detail) {
                this.dispatchEvent(new CustomEvent(type, { detail, bubbles: true, composed: true }));
            }
        }

        class ChallengeBanner extends LitElement {
            static properties = { challenge: { type: Object } };
            static styles = [SHARED_STYLES, css`
                :host { display: block; }
                .banner { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 0.4rem 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
                .row { display: flex; gap: 0.3rem; }
                .details { font-size: 0.72rem; color: #666; display: flex; flex-wrap: wrap; gap: 0.4rem; }
            `];
            render() {
                if (!this.challenge) return html``;
                const c = this.challenge;
                const extras = Object.entries(c.options ?? {}).map(([k, v]) => `${k}: ${v}`);
                return html`
                    <div class="banner">
                        <strong>Challenge from ${c.challengerName}</strong>
                        <div class="details">
                            <span>📋 ${c.ruleType}</span>
                            ${extras.map(e => html`<span>${e}</span>`)}
                        </div>
                        <div class="row">
                            <button class="btn-accept" aria-label="Accept challenge" @click=${() => this._emit('accept')}>Accept</button>
                            <button class="btn-decline" aria-label="Decline challenge" @click=${() => this._emit('decline')}>Decline</button>
                        </div>
                    </div>`;
            }
            _emit(type) {
                this.dispatchEvent(new CustomEvent(type, { bubbles: true, composed: true }));
            }
        }

        class SentChallengeBanner extends LitElement {
            static properties = { challenge: { type: Object } };
            static styles = [SHARED_STYLES, css`
                :host { display: block; }
                .banner { border-radius: 6px; padding: 0.4rem 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; border: 1px solid; }
                .pending { background: #fff3cd; border-color: #ffc107; }
                .declined { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
                .timeout { background: #e2e3e5; border-color: #d6d8db; color: #383d41; }
                .row { display: flex; gap: 0.3rem; align-items: center; justify-content: space-between; }
                .details { font-size: 0.72rem; }
            `];
            render() {
                if (!this.challenge) return html``;
                const c = this.challenge;
                const isWaiting = c.status === 'pending';
                const isDecline = c.status === 'declined';
                const isTimeout = c.status === 'timeout';

                return html`
                    <div class="banner ${c.status}">
                        <div class="row">
                            <strong>
                                ${isWaiting ? `⏳ Waiting for ${c.recipientName}…` : ''}
                                ${isDecline ? `❌ ${c.recipientName} declined your challenge.` : ''}
                                ${isTimeout ? `🕒 Challenge to ${c.recipientName} timed out.` : ''}
                            </strong>
                            ${isWaiting
                                ? html`<button class="btn-leave" @click=${() => this._emit('cancel')}>Cancel</button>`
                                : html`<button @click=${() => this._emit('dismiss')} aria-label="Dismiss">✕</button>`
                            }
                        </div>
                        <div class="details">📋 ${c.ruleType}</div>
                    </div>`;
            }
            _emit(type) {
                this.dispatchEvent(new CustomEvent(type, { bubbles: true, composed: true }));
            }
        }

        class ChatBanner extends LitElement {
            static properties = { message: { type: Object } };
            static styles = [SHARED_STYLES, css`
                :host { display: block; }
                .banner { background: #e1f5fe; border: 1px solid #81d4fa; border-radius: 6px; padding: 0.4rem 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
                .row { display: flex; gap: 0.3rem; align-items: center; }
                input { flex: 1; padding: 0.2rem 0.4rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.8rem; }
            `];
            render() {
                if (!this.message) return html``;
                return html`
                    <div class="banner">
                        <strong>💬 ${this.message.senderId}: ${this.message.text}</strong>
                        <div class="row">
                            <input id="reply" placeholder="Reply…" @keyup=${e => e.key === 'Enter' && this._send()} />
                            <button class="btn-accept" @click=${this._send}>Send</button>
                            <button @click=${() => this._emit('dismiss')} aria-label="Dismiss message">✕</button>
                        </div>
                    </div>`;
            }
            _send() {
                const val = this.shadowRoot.getElementById('reply')?.value;
                if (val) this._emit('reply', val);
            }
            _emit(type, detail) {
                this.dispatchEvent(new CustomEvent(type, { detail, bubbles: true, composed: true }));
            }
        }

        class ChallengeModal extends LitElement {
            static properties = { userId: { type: String }, userName: { type: String } };
            static styles = [SHARED_STYLES, css`
                :host { display: block; }
                .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
                .modal { background: #fff; border-radius: 8px; padding: 1rem; min-width: 220px; display: flex; flex-direction: column; gap: 0.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.2); }
                h3 { margin: 0; font-size: 0.95rem; }
                .rules { display: flex; flex-direction: column; gap: 0.3rem; }
                button.rule { text-align: left; padding: 0.35rem 0.6rem; font-size: 0.82rem; display: flex; align-items: center; gap: 0.4rem; }
                button.rule img { width: 28px; height: 28px; display: block; }
                button.cancel { background: #f8f9fa; color: #333; border-color: #ccc; }
                .icon-wrap { position: relative; width: 28px; height: 28px; flex-shrink: 0; }
                .icon-wrap img { width: 28px; height: 28px; display: block; }
                .badge { position: absolute; bottom: 0; right: 0; background: #dc3545; color: #fff; font-size: 0.55rem; font-weight: bold; border-radius: 3px; padding: 0 2px; line-height: 1.3; }
            `];
            static RULES = [
                { id: 'eightball',     label: 'Eight Ball',       img: 'assets/eightball.png' },
                { id: 'nineball',      label: 'Nine Ball',        img: 'assets/nineball.png' },
                { id: 'threecushion',  label: 'Three Cushion',       img: 'assets/threecushion.png' },
                { id: 'threecushion',  label: 'Three Cushion (11)', img: 'assets/threecushion.png', options: { raceTo: '11' } },
                { id: 'threecushion',  label: 'Three Cushion (21)', img: 'assets/threecushion.png', options: { raceTo: '21' } },
                { id: 'snooker',       label: 'Snooker',             img: 'assets/snooker.png' },
                { id: 'snooker',       label: 'Snooker (6 reds)',    img: 'assets/snooker.png', options: { reds: '6' } },
            ];
            render() {
                if (!this.userId) return html``;
                return html`
                    <div class="backdrop" @click=${e => e.target === e.currentTarget && this._emit('cancel')}>
                        <div class="modal" role="dialog" aria-modal="true" aria-label="Select game type">
                            <h3>Challenge ${this.userName}</h3>
                            <div class="rules">
                                ${ChallengeModal.RULES.map(r => html`
                                    <button class="rule btn-challenge" @click=${() => this._emit('confirm', { ruleType: r.id, options: r.options })}>
                                        <span class="icon-wrap">
                                            <img src=${r.img} alt=${r.label} />
                                            ${r.options ? html`<span class="badge">${Object.values(r.options)[0]}</span>` : ''}
                                        </span>
                                        ${r.label}
                                    </button>`)}
                            </div>
                            <button class="cancel" @click=${() => this._emit('cancel')}>Cancel</button>
                        </div>
                    </div>`;
            }
            _emit(type, detail) {
                this.dispatchEvent(new CustomEvent(type, { detail, bubbles: true, composed: true }));
            }
        }

        // ── Main App ───────────────────────────────────────────────────────

        class LobbyApp extends LitElement {
            static styles = css`
                :host { display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; font-size: 0.85rem; box-sizing: border-box; padding: 0.5rem; gap: 0.4rem; background: #f5f5f5; }
                .status-bar { display: flex; align-items: center; gap: 0.5rem; }
                .dot { width: 8px; height: 8px; border-radius: 50%; background: #dc3545; flex-shrink: 0; }
                .dot.on { background: #28a745; }
                .games { display: flex; gap: 0.5rem; flex-wrap: wrap; }
                .game-btn { border: none; background: none; cursor: pointer; padding: 0.25rem; text-align: center; opacity: 0.7; }
                .game-btn:hover { opacity: 1; }
                .game-btn img { display: block; width: 48px; height: 48px; }
                .game-btn span { font-size: 0.65rem; display: block; }
                .panel { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 0.4rem; }
                .panel-title { font-weight: bold; margin-bottom: 0.25rem; font-size: 0.8rem; color: #555; }
            `;

            constructor() {
                super();
                this._ctrl = new LobbyController(this);
                this._pendingChallenge = null; // { userId, userName }
            }

            _renderStatusBar() {
                const c = this._ctrl;
                return html`
                    <div class="status-bar">
                        <span class="dot ${c.connected ? 'on' : ''}"></span>
                        <strong>${c.myName}</strong>
                        <span style="color:#888;font-size:0.75rem">${c.connected ? 'online' : 'connecting…'} · ${c.users.length} online</span>
                    </div>`;
            }

            _renderGames() {
                return html`
                    <div class="games">
                        ${GAMES.map(g => html`
                            <button class="game-btn" title=${g.label} aria-label="Play ${g.label}">
                                <img src=${g.img} alt=${g.label} />
                                <span>${g.label}</span>
                            </button>`)}
                    </div>`;
            }

            _renderUsers() {
                const c = this._ctrl;
                return html`
                    <challenge-banner
                        .challenge=${c.activeChallenge}
                        @accept=${() => c.acceptChallenge()}
                        @decline=${() => c.declineChallenge()}>
                    </challenge-banner>
                    <sent-challenge-banner
                        .challenge=${c.sentChallenge}
                        @cancel=${() => c.cancelChallenge()}
                        @dismiss=${() => c.clearSentChallenge()}>
                    </sent-challenge-banner>
                    <chat-banner
                        .message=${c.activeChat}
                        @reply=${e => { c.sendChat(c.activeChat.senderId, e.detail); c.dispatch({ type: 'CHAT_DISMISS' }); }}
                        @dismiss=${() => c.dispatch({ type: 'CHAT_DISMISS' })}>
                    </chat-banner>
                    <div class="panel">
                        <div class="panel-title">Online Players (${c.users.length})</div>
                        <user-list
                            .users=${c.users}
                            myId=${c.myId}
                            tableId=${c.tableId || ''}
                            .isChallengePending=${c.sentChallenge?.status === 'pending'}
                            @challenge=${e => {
                                const u = c.users.find(u => u.userId === e.detail);
                                this._pendingChallenge = { userId: e.detail, userName: u?.userName ?? e.detail };
                                this.requestUpdate();
                            }}
                            @spectate=${e => c.spectate(e.detail.tableId, e.detail.ruleType)}
                            @chat=${e => { const t = prompt('Message:'); if (t) c.sendChat(e.detail, t); }}>
                        </user-list>
                    </div>`;
            }

            _renderGamePanel() {
                const c = this._ctrl;
                if (!c.tableId) return html``;
                const url = gameUrl({ tableId: c.tableId, userId: c.myId, userName: c.myName, ruleType: c.ruleType, spectating: c.spectating, isFirst: c.isFirst, options: c.matchOptions });
                window.location.href = url;
                return html``;
            }

            render() {
                const p = this._pendingChallenge;
                return html`
                    ${this._renderStatusBar()}
                    ${this._renderGames()}
                    ${this._renderUsers()}
                    ${this._renderGamePanel()}
                    <challenge-modal
                        .userId=${p?.userId ?? null}
                        .userName=${p?.userName ?? ''}
                        @confirm=${e => { this._ctrl.challenge(p.userId, e.detail.ruleType, e.detail.options); this._pendingChallenge = null; }}
                        @cancel=${() => { this._pendingChallenge = null; this.requestUpdate(); }}>
                    </challenge-modal>
                `;
            }
        }

        customElements.define('user-list',        UserList);
        customElements.define('challenge-banner', ChallengeBanner);
        customElements.define('sent-challenge-banner', SentChallengeBanner);
        customElements.define('chat-banner',      ChatBanner);
        customElements.define('challenge-modal',  ChallengeModal);
        customElements.define('lobby-app',        LobbyApp);
    </script>
</body>
</html>
