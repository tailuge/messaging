<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>
</head>
<body>
    <lobby-app></lobby-app>

    <script type="module">
        import { LitElement, html, css } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';
        import { MessagingClient, canChallenge, canSpectate } from 'https://unpkg.com/@tailuge/messaging';

        // ── Constants ──────────────────────────────────────────────────────

        const GAMES = [
            { label: "Eight Ball",    img: "assets/eightball.png" },
            { label: "Nine Ball",     img: "assets/nineball.png" },
            { label: "Snooker",       img: "assets/snooker.png" },
            { label: "Three Cushion", img: "assets/threecushion.png" },
            { label: "Practice",      img: "assets/practice.png" },
        ];

        const SHARED_STYLES = css`
            button { cursor: pointer; padding: 0.15rem 0.4rem; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 0.75rem; transition: background-color 0.2s, opacity 0.2s; }
            button:hover { background-color: #f0f0f0; }
            button:active { background-color: #e0e0e0; }
            button:focus-visible { outline: 2px solid #007bff; outline-offset: 2px; }
            .btn-challenge { background: #007bff; color: #fff; border-color: #007bff; }
            .btn-challenge:hover { background: #0069d9; border-color: #0062cc; }
            .btn-spectate  { background: #fd7e14; color: #fff; border-color: #fd7e14; }
            .btn-spectate:hover { background: #e36e0b; border-color: #d6660a; }
            .btn-chat      { background: #6c757d; color: #fff; border-color: #6c757d; }
            .btn-chat:hover { background: #5a6268; border-color: #545b62; }
            .btn-accept    { background: #28a745; color: #fff; border-color: #28a745; }
            .btn-accept:hover { background: #218838; border-color: #1e7e34; }
            .btn-decline   { background: #dc3545; color: #fff; border-color: #dc3545; }
            .btn-decline:hover { background: #c82333; border-color: #bd2130; }
            .btn-leave     { background: #6c757d; color: #fff; border-color: #6c757d; }
            .btn-leave:hover { background: #5a6268; border-color: #545b62; }
        `;

        // ── Helpers ────────────────────────────────────────────────────────

        const flag = (code) => code
            ? [...code.toUpperCase()].map(c => String.fromCodePoint(0x1F1E6 - 65 + c.charCodeAt(0))).join('')
            : '🌐';

        const gameUrl = ({ tableId, userId, userName, ruleType, spectating, isFirst }) => {
            let url = `https://billiards.tailuge.workers.dev/?websocketserver=wss://billiards.onrender.com/ws`
                + `&tableId=${tableId}&name=${encodeURIComponent(userName)}&clientId=${userId}&ruletype=${ruleType}`;
            if (spectating) url += '&spectator=true';
            else if (isFirst) url += '&first=true';
            return url;
        };

        // ── Controller (networking + state) ───────────────────────────────

        class LobbyController {
            // ReactiveController lifecycle
            host; _lobby = null; _table = null; _pendingTableId = null;

            // State read by the host template
            connected = false; users = []; activeChallenge = null; activeChat = null;
            tableId = null; ruleType = 'standard'; spectating = false; isFirst = false;

            constructor(host) {
                const p = new URLSearchParams(location.search);
                this.myId   = p.get('id')   || 'user-' + Math.random().toString(36).slice(2, 7);
                this.myName = p.get('name') || 'Player';
                this._client = new MessagingClient({ baseUrl: location.hostname === 'localhost' ? location.hostname : 'billiards-network.onrender.com' });
                (this.host = host).addController(this);
            }

            // Called by Lit when the host connects to the DOM
            async hostConnected() {
                try { await this._connect(); }
                catch (e) { console.error('Lobby connect failed:', e); }
            }

            async _connect() {
                this._lobby = await this._client.joinLobby({
                    messageType: 'presence', type: 'join',
                    userId: this.myId, userName: this.myName,
                });
                this.connected = true;
                this.host.requestUpdate();

                this._lobby.onUsersChange(users => {
                    this.users = users;
                    this.host.requestUpdate();
                });

                this._lobby.onChallenge(msg => {
                    if (msg.type === 'offer') {
                        this.activeChallenge = msg;
                    } else if (msg.type === 'accept' && this._pendingTableId === msg.tableId) {
                        this._pendingTableId = null;
                        Object.assign(this, { ruleType: msg.ruleType, spectating: false, isFirst: true, tableId: msg.tableId });
                    } else if ((msg.type === 'decline' || msg.type === 'cancel')
                               && this.activeChallenge?.challengerId === msg.challengerId) {
                        this.activeChallenge = null;
                    }
                    this.host.requestUpdate();
                });

                this._lobby.onChat(msg => {
                    this.activeChat = msg;
                    this.host.requestUpdate();
                });
            }

            async challenge(userId, ruleType) {
                this._pendingTableId = await this._lobby.challenge(userId, ruleType);
            }

            async acceptChallenge() {
                const c = this.activeChallenge;
                this._table = await this._lobby.acceptChallenge(c.challengerId, c.ruleType, c.tableId);
                Object.assign(this, { ruleType: c.ruleType, spectating: false, isFirst: false, tableId: c.tableId, activeChallenge: null });
                this.host.requestUpdate();
            }

            async declineChallenge() {
                const c = this.activeChallenge;
                await this._lobby.declineChallenge(c.challengerId, c.ruleType);
                this.activeChallenge = null;
                this.host.requestUpdate();
            }

            async spectate(tableId) {
                this._table = await this._client.joinTable(tableId, this.myId);
                Object.assign(this, { spectating: true, ruleType: 'standard', tableId });
                this.host.requestUpdate();
            }

            async leaveGame() {
                if (this._table) { await this._table.leave(); this._table = null; }
                await this._lobby.updatePresence({ tableId: undefined });
                this.tableId = null;
                this.host.requestUpdate();
            }

            sendChat(recipientId, text) {
                this._lobby.sendChat(recipientId, text);
            }
        }

        // ── UI Components ──────────────────────────────────────────────────

        class UserList extends LitElement {
            static properties = {
                users:   { type: Array },
                myId:    { type: String },
                tableId: { type: String },
            };
            static styles = [SHARED_STYLES, css`
                :host { display: block; }
                ul { list-style: none; margin: 0; padding: 0; max-height: 160px; overflow-y: auto; }
                li { display: flex; justify-content: space-between; align-items: center; padding: 0.15rem 0; border-bottom: 1px solid #f0f0f0; gap: 0.25rem; }
                li:last-child { border-bottom: none; }
                .user-info { display: flex; flex-direction: column; }
                .user-name { font-weight: 500; font-size: 0.85rem; }
                .user-status { font-size: 0.7rem; color: #888; }
                .actions { display: flex; gap: 0.2rem; flex-shrink: 0; }
            `];

            render() {
                const others = (this.users || []).filter(u => u.userId !== this.myId);
                if (others.length === 0) {
                    return html`<div style="padding: 1rem; text-align: center; color: #888; font-style: italic; font-size: 0.8rem;">
                        No other players online yet. Invite a friend!
                    </div>`;
                }
                return html`<ul>${(this.users || []).map(u => this._row(u))}</ul>`;
            }

            _row(u) {
                const isMe   = u.userId === this.myId;
                const status = u.tableId ? '🎱 in game' : u.seek ? '🔍 seeking' : '✓ available';
                let actions  = html``;
                if (!isMe) {
                    if (canSpectate(u, this.tableId)) {
                        actions = html`<button class="btn-spectate" @click=${() => this._emit('spectate', u.tableId)}>Spectate</button>`;
                    } else if (canChallenge(u, this.myId)) {
                        actions = html`
                            <button class="btn-challenge" @click=${() => this._emit('challenge', u.userId)}>Challenge</button>
                            <button class="btn-chat"      @click=${() => this._emit('chat', u.userId)}>Chat</button>`;
                    }
                }
                return html`
                    <li>
                        <div class="user-info">
                            <span class="user-name">${flag(u.meta?.country)} ${u.userName}${isMe ? ' (you)' : ''}</span>
                            <span class="user-status">${status}</span>
                        </div>
                        <div class="actions">${actions}</div>
                    </li>`;
            }

            _emit(type, detail) {
                this.dispatchEvent(new CustomEvent(type, { detail, bubbles: true, composed: true }));
            }
        }

        class ChallengeBanner extends LitElement {
            static properties = { challenge: { type: Object } };
            static styles = [SHARED_STYLES, css`
                :host { display: block; }
                .banner { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 0.4rem 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
                .row { display: flex; gap: 0.3rem; }
                .details { font-size: 0.72rem; color: #666; display: flex; flex-wrap: wrap; gap: 0.4rem; }
            `];
            render() {
                if (!this.challenge) return html``;
                const c = this.challenge;
                const extras = Object.entries(c.options ?? {}).map(([k, v]) => `${k}: ${v}`);
                const location = [c.meta?.city, c.meta?.country ? flag(c.meta.country) : null].filter(Boolean).join(' ');
                return html`
                    <div class="banner">
                        <strong>⚔️ Challenge from ${c.challengerName}</strong>
                        <div class="details">
                            <span>📋 ${c.ruleType}</span>
                            ${location ? html`<span>${location}</span>` : ''}
                            ${extras.map(e => html`<span>${e}</span>`)}
                        </div>
                        <div class="row">
                            <button class="btn-accept"  @click=${() => this._emit('accept')}>Accept</button>
                            <button class="btn-decline" @click=${() => this._emit('decline')}>Decline</button>
                        </div>
                    </div>`;
            }
            _emit(type) {
                this.dispatchEvent(new CustomEvent(type, { bubbles: true, composed: true }));
            }
        }

        class ChatBanner extends LitElement {
            static properties = { message: { type: Object } };
            static styles = [SHARED_STYLES, css`
                :host { display: block; }
                .banner { background: #e1f5fe; border: 1px solid #81d4fa; border-radius: 6px; padding: 0.4rem 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
                .row { display: flex; gap: 0.3rem; align-items: center; }
                input { flex: 1; padding: 0.2rem 0.4rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.8rem; }
            `];
            render() {
                if (!this.message) return html``;
                return html`
                    <div class="banner">
                        <strong>💬 ${this.message.senderId}: ${this.message.text}</strong>
                        <div class="row">
                            <input id="reply" placeholder="Reply…" @keyup=${e => e.key === 'Enter' && this._send()} />
                            <button class="btn-accept" @click=${this._send}>Send</button>
                            <button @click=${() => this._emit('dismiss')} aria-label="Dismiss message">✕</button>
                        </div>
                    </div>`;
            }
            _send() {
                const val = this.shadowRoot.getElementById('reply')?.value;
                if (val) this._emit('reply', val);
            }
            _emit(type, detail) {
                this.dispatchEvent(new CustomEvent(type, { detail, bubbles: true, composed: true }));
            }
        }

        class ChallengeModal extends LitElement {
            static properties = { userId: { type: String }, userName: { type: String } };
            static styles = [SHARED_STYLES, css`
                :host { display: block; }
                .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
                .modal { background: #fff; border-radius: 8px; padding: 1rem; min-width: 220px; display: flex; flex-direction: column; gap: 0.5rem; box-shadow: 0 4px 24px rgba(0,0,0,0.2); }
                h3 { margin: 0; font-size: 0.95rem; }
                .rules { display: flex; flex-direction: column; gap: 0.3rem; }
                button.rule { text-align: left; padding: 0.35rem 0.6rem; font-size: 0.82rem; display: flex; align-items: center; gap: 0.4rem; }
                button.rule img { width: 28px; height: 28px; display: block; }
                button.cancel { background: #f8f9fa; color: #333; border-color: #ccc; }
            `];
            static RULES = [
                { id: 'eightball',     label: 'Eight Ball',    img: 'assets/eightball.png' },
                { id: 'nineball',      label: 'Nine Ball',     img: 'assets/nineball.png' },
                { id: 'threecushion',  label: 'Three Cushion', img: 'assets/threecushion.png' },
                { id: 'snooker',       label: 'Snooker',       img: 'assets/snooker.png' },
            ];
            render() {
                if (!this.userId) return html``;
                return html`
                    <div class="backdrop" @click=${e => e.target === e.currentTarget && this._emit('cancel')}>
                        <div class="modal" role="dialog" aria-modal="true" aria-label="Select game type">
                            <h3>Challenge ${this.userName}</h3>
                            <div class="rules">
                                ${ChallengeModal.RULES.map(r => html`
                                    <button class="rule btn-challenge" @click=${() => this._emit('confirm', r.id)}>
                                        <img src=${r.img} alt=${r.label} />${r.label}
                                    </button>`)}
                            </div>
                            <button class="cancel" @click=${() => this._emit('cancel')}>Cancel</button>
                        </div>
                    </div>`;
            }
            _emit(type, detail) {
                this.dispatchEvent(new CustomEvent(type, { detail, bubbles: true, composed: true }));
            }
        }

        // ── Main App ───────────────────────────────────────────────────────

        class LobbyApp extends LitElement {
            static styles = css`
                :host { display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; font-size: 0.85rem; box-sizing: border-box; padding: 0.5rem; gap: 0.4rem; background: #f5f5f5; }
                .status-bar { display: flex; align-items: center; gap: 0.5rem; }
                .dot { width: 8px; height: 8px; border-radius: 50%; background: #dc3545; flex-shrink: 0; }
                .dot.on { background: #28a745; }
                .games { display: flex; gap: 0.5rem; flex-wrap: wrap; }
                .game-btn { border: none; background: none; cursor: pointer; padding: 0.25rem; text-align: center; opacity: 0.7; }
                .game-btn:hover { opacity: 1; }
                .game-btn img { display: block; width: 48px; height: 48px; }
                .game-btn span { font-size: 0.65rem; display: block; }
                .panel { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 0.4rem; }
                .panel-title { font-weight: bold; margin-bottom: 0.25rem; font-size: 0.8rem; color: #555; }
                .game-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; border-radius: 6px; overflow: hidden; border: 1px solid #ddd; }
                .game-panel-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.25rem 0.5rem; background: #e8f5e9; font-size: 0.75rem; }
                iframe { flex: 1; border: none; width: 100%; }
                button.btn-leave { cursor: pointer; padding: 0.15rem 0.4rem; border: 1px solid #6c757d; border-radius: 4px; background: #6c757d; color: #fff; font-size: 0.75rem; }
            `;

            constructor() {
                super();
                this._ctrl = new LobbyController(this);
                this._pendingChallenge = null; // { userId, userName }
            }

            _renderStatusBar() {
                const c = this._ctrl;
                return html`
                    <div class="status-bar">
                        <span class="dot ${c.connected ? 'on' : ''}"></span>
                        <strong>${c.myName}</strong>
                        <span style="color:#888;font-size:0.75rem">${c.connected ? 'online' : 'connecting…'} · ${c.users.length} online</span>
                    </div>`;
            }

            _renderGames() {
                return html`
                    <div class="games">
                        ${GAMES.map(g => html`
                            <button class="game-btn" title=${g.label} aria-label="Play ${g.label}">
                                <img src=${g.img} alt=${g.label} />
                                <span>${g.label}</span>
                            </button>`)}
                    </div>`;
            }

            _renderUsers() {
                const c = this._ctrl;
                return html`
                    <challenge-banner
                        .challenge=${c.activeChallenge}
                        @accept=${() => c.acceptChallenge()}
                        @decline=${() => c.declineChallenge()}>
                    </challenge-banner>
                    <chat-banner
                        .message=${c.activeChat}
                        @reply=${e => { c.sendChat(c.activeChat.senderId, e.detail); c.activeChat = null; this.requestUpdate(); }}
                        @dismiss=${() => { c.activeChat = null; this.requestUpdate(); }}>
                    </chat-banner>
                    <div class="panel">
                        <div class="panel-title">Online Players (${c.users.length})</div>
                        <user-list
                            .users=${c.users}
                            myId=${c.myId}
                            tableId=${c.tableId || ''}
                            @challenge=${e => {
                                const u = c.users.find(u => u.userId === e.detail);
                                this._pendingChallenge = { userId: e.detail, userName: u?.userName ?? e.detail };
                                this.requestUpdate();
                            }}
                            @spectate=${e => c.spectate(e.detail)}
                            @chat=${e => { const t = prompt('Message:'); if (t) c.sendChat(e.detail, t); }}>
                        </user-list>
                    </div>`;
            }

            _renderGamePanel() {
                const c = this._ctrl;
                if (!c.tableId) return html``;
                return html`
                    <div class="game-panel">
                        <div class="game-panel-bar">
                            <span>${c.spectating ? '👁 Spectating' : '🎱 Playing'} · table ${c.tableId}</span>
                            <button class="btn-leave" @click=${() => c.leaveGame()}>Leave</button>
                        </div>
                        <iframe src=${gameUrl({ tableId: c.tableId, userId: c.myId, userName: c.myName, ruleType: c.ruleType, spectating: c.spectating, isFirst: c.isFirst })}></iframe>
                    </div>`;
            }

            render() {
                const p = this._pendingChallenge;
                return html`
                    ${this._renderStatusBar()}
                    ${this._renderGames()}
                    ${this._renderUsers()}
                    ${this._renderGamePanel()}
                    <challenge-modal
                        .userId=${p?.userId ?? null}
                        .userName=${p?.userName ?? ''}
                        @confirm=${e => { this._ctrl.challenge(p.userId, e.detail); this._pendingChallenge = null; }}
                        @cancel=${() => { this._pendingChallenge = null; this.requestUpdate(); }}>
                    </challenge-modal>
                `;
            }
        }

        customElements.define('user-list',        UserList);
        customElements.define('challenge-banner', ChallengeBanner);
        customElements.define('chat-banner',      ChatBanner);
        customElements.define('challenge-modal',  ChallengeModal);
        customElements.define('lobby-app',        LobbyApp);
    </script>
</body>
</html>
