<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>
    <link rel="icon" type="image/png" href="assets/golden-cup.png">
    <style>*, html, body { margin: 0; padding: 0; box-sizing: border-box; } html, body { height: 100%; overflow-y: auto; scrollbar-width: none; } body::-webkit-scrollbar { display: none; } main { margin: 0 0.2rem; } html[theme="dark"], html[theme="dark"] body { background: #1a1a1a; } html[theme="light"], html[theme="light"] body { background: #f5f5f5; }</style>
    <script>
        const _t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('theme', _t);
    </script>
</head>
<body>
    <main>
        <lobby-app></lobby-app>
    </main>

    <script type="module">
        import { LitElement, html } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';
        import { LOBBY_APP_STYLES, BURGER_MENU_STYLES } from './styles.js';
        import './solo-panel.js';
        import './info-panel.js';
        import './online-panel.js';

        class LobbyApp extends LitElement {
            static properties = {
                _menuOpen: { state: true },
                _theme: { type: String, reflect: true, attribute: 'theme' }
            };
            static styles = [LOBBY_APP_STYLES, BURGER_MENU_STYLES];

            constructor() {
                super();
                this._menuOpen = false;
                this._theme = document.documentElement.getAttribute('theme') || 'light';
            }

            _toggleMenu(e) {
                e?.stopPropagation();
                this._menuOpen = !this._menuOpen;
            }

            _setTheme(theme) {
                this._theme = theme;
                document.documentElement.setAttribute('theme', theme);
                localStorage.setItem('theme', theme);
                this._menuOpen = false;
            }

            _closeMenu = (e) => {
                if (this._menuOpen && !this.renderRoot.contains(e.target)) this._menuOpen = false;
            };

            connectedCallback() {
                super.connectedCallback();
                document.addEventListener('click', this._closeMenu);
            }

            disconnectedCallback() {
                super.disconnectedCallback();
                document.removeEventListener('click', this._closeMenu);
            }

            render() {
                const p = new URLSearchParams(location.search);
                const userId   = p.get('clientId') || '';
                const userName = p.get('userName')  || 'Player';
                const isDark = this._theme === 'dark';
                return html`
                    <div class="topbar" @click=${e => e.stopPropagation()}>
                        <h1><a href="https://github.com/tailuge/billiards" target="_blank" rel="noopener">Billiards</a></h1>
                        <button class="burger"
                            aria-label="Menu"
                            aria-expanded="${this._menuOpen}"
                            @click=${this._toggleMenu}>
                            &#9776;
                        </button>
                        ${this._menuOpen ? html`
                            <div class="menu">
                                <label>
                                    <input type="checkbox" .checked=${isDark}
                                        @change=${e => this._setTheme(e.target.checked ? 'dark' : 'light')}>
                                    Dark mode
                                </label>
                            </div>` : ''}
                    </div>
                    <div class="main-row">
                        <div class="solo">
                            <div class="panel">
                                <div class="panel-title">Solo Practice</div>
                                <solo-panel userId=${userId} userName=${userName}></solo-panel>
                            </div>
                        </div>
                        <div class="players panel"><online-panel></online-panel></div>
                    </div>
                    <div class="info-row"><div class="panel"><info-panel></info-panel></div></div>
                `;
            }
        }

        customElements.define('lobby-app', LobbyApp);
    </script>
</body>
</html>
