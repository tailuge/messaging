<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>
</head>
<body>
    <main>
        <lobby-app></lobby-app>
    </main>

    <script type="module">
        import { LitElement, html } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';
        import { MessagingClient, canChallenge } from 'https://unpkg.com/@tailuge/messaging';
        import {
            SHARED_STYLES,
            USER_LIST_STYLES,
            CHALLENGE_BANNER_STYLES,
            SENT_CHALLENGE_BANNER_STYLES,
            CHALLENGE_MODAL_STYLES,
            LOBBY_APP_STYLES
        } from './styles.js';

        // ── Helpers ────────────────────────────────────────────────────────

        const flag = (code) => code
            ? [...code.toUpperCase()].map(c => String.fromCodePoint(0x1F1E6 - 65 + c.charCodeAt(0))).join('')
            : '🌐';

        const gameUrl = ({ tableId, userId, userName, ruleType, isFirst, options }) => {
            let url = `https://billiards.tailuge.workers.dev/?websocketserver=wss://billiards.onrender.com/ws`
                + `&tableId=${tableId}&userName=${encodeURIComponent(userName)}&clientId=${userId}&ruletype=${ruleType}`;
            if (isFirst) url += '&first=true';
            if (options) Object.entries(options).forEach(([k, v]) => url += `&${encodeURIComponent(k)}=${encodeURIComponent(v)}`);
            return url;
        };

        const INITIAL_STATE = {
            connected: false,
            users: [],
            challenges: {}, // indexed by other player's ID
            currentMatch: null // { tableId, ruleType, isFirst }
        };

        function reduce(state, action) {
            switch (action.type) {
                case 'CONNECTED':
                    return { ...state, connected: action.payload };
                case 'USERS_UPDATE':
                    return { ...state, users: action.payload };
                case 'CHALLENGE_SENT':
                    return {
                        ...state,
                        challenges: {
                            ...state.challenges,
                            [action.payload.recipientId]: { ...action.payload, status: 'pending' }
                        }
                    };
                case 'CHALLENGE_MSG': {
                    const msg = action.payload;
                    const { myId } = action;
                    const challenges = { ...state.challenges };
                    if (msg.type === 'offer') {
                        const existing = challenges[msg.challengerId];
                        if (!existing || existing.tableId !== msg.tableId) {
                            challenges[msg.challengerId] = { ...msg, status: 'pending' };
                        }
                    } else if (msg.type === 'accept') {
                        if (state.currentMatch) return state;
                        const otherId = msg.challengerId === myId ? msg.recipientId : msg.challengerId;
                        const pending = challenges[otherId];
                        const options = msg.options || (pending?.tableId === msg.tableId ? pending.options : undefined);
                        if (pending && pending.tableId === msg.tableId) {
                            delete challenges[otherId];
                        }
                        // Enter the match based on whether we sent or received the acceptance
                        if (msg.recipientId === myId) {
                            return {
                                ...state,
                                challenges,
                                currentMatch: { tableId: msg.tableId, ruleType: msg.ruleType, options, isFirst: true }
                            };
                        } else if (msg.challengerId === myId) {
                            return {
                                ...state,
                                challenges,
                                currentMatch: { tableId: msg.tableId, ruleType: msg.ruleType, options, isFirst: false }
                            };
                        }
                    } else if (msg.type === 'decline' || msg.type === 'cancel') {
                        const otherId = msg.challengerId === myId ? msg.recipientId : msg.challengerId;
                        if (challenges[otherId]) {
                            if (msg.type === 'decline' && challenges[otherId].recipientId === otherId) {
                                challenges[otherId] = { ...challenges[otherId], status: 'declined' };
                            } else {
                                delete challenges[otherId];
                            }
                        }
                    }
                    return { ...state, challenges };
                }
                case 'CHALLENGE_TIMEOUT':
                    if (state.challenges[action.payload]?.status === 'pending') {
                        return {
                            ...state,
                            challenges: {
                                ...state.challenges,
                                [action.payload]: { ...state.challenges[action.payload], status: 'timeout' }
                            }
                        };
                    }
                    return state;
                case 'CHALLENGE_DISMISS': {
                    const challenges = { ...state.challenges };
                    delete challenges[action.payload];
                    return { ...state, challenges };
                }
                case 'MATCH_SET':
                    return { ...state, currentMatch: action.payload };
                case 'MATCH_LEAVE':
                    return { ...state, currentMatch: null };
                default:
                    return state;
            }
        }

        // ── Controller (networking + state) ───────────────────────────────

        class LobbyController {
            // ReactiveController lifecycle
            host; _lobby = null; _table = null; _challengeTimers = new Map();

            // State derived via getters
            state = { ...INITIAL_STATE };

            get connected() { return this.state.connected; }
            get users() { return this.state.users; }
            get tableId() { return this.state.currentMatch?.tableId; }
            get ruleType() { return this.state.currentMatch?.ruleType || 'standard'; }
            get isFirst() { return !!this.state.currentMatch?.isFirst; }
            get matchOptions() { return this.state.currentMatch?.options; }

            get activeChallenge() {
                return Object.values(this.state.challenges)
                    .find(c => c.recipientId === this.myId && c.status === 'pending');
            }
            get sentChallenge() {
                return Object.values(this.state.challenges)
                    .find(c => c.challengerId === this.myId);
            }

            constructor(host) {
                const p = new URLSearchParams(location.search);
                this.myId   = p.get('clientId') || 'user-' + Math.random().toString(36).slice(2, 7);
                this.myName = p.get('userName')  || 'Player';

                let baseUrl = 'https://billiards-network.onrender.com';
                if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
                    const protocol = location.protocol === 'https:' ? 'https:' : 'http:';
                    baseUrl = `${protocol}//${location.host}`;
                }

                this._client = new MessagingClient({ baseUrl });
                (this.host = host).addController(this);
            }

            dispatch(action) {
                this.state = reduce(this.state, { ...action, myId: this.myId });
                this.host.requestUpdate();
            }

            // Called by Lit when the host connects to the DOM
            async hostConnected() {
                try { await this._connect(); }
                catch (e) { console.error('Lobby connect failed:', e); }
            }

            hostDisconnected() {
                this._clearAllChallengeTimers();
                this._lobby?.leave();
            }

            async _connect() {
                this._connectTime = Date.now();
                this._lobby = await this._client.joinLobby({
                    messageType: 'presence', type: 'join',
                    userId: this.myId, userName: this.myName,
                });
                this.dispatch({ type: 'CONNECTED', payload: true });

                this._lobby.onUsersChange(users => {
                    this.dispatch({ type: 'USERS_UPDATE', payload: users });
                });

                this._lobby.onChallenge(msg => {
                    const msgTime = msg.meta?.ts ? new Date(msg.meta.ts).getTime() : 0;
                    if (msgTime < this._connectTime) return; // ignore buffered messages from previous session
                    console.log('challenge msg:', JSON.stringify(msg, null, 2));
                    this._clearTimerFor(msg.challengerId === this.myId ? msg.recipientId : msg.challengerId);
                    this.dispatch({ type: 'CHALLENGE_MSG', payload: msg });
                });
            }

            async challenge(userId, ruleType, options) {
                const u = this.users.find(u => u.userId === userId);
                const tableId = await this._lobby.challenge(userId, ruleType, undefined, options);
                const payload = { challengerId: this.myId, recipientId: userId, recipientName: u?.userName || userId, ruleType, options, tableId };
                console.log('challenge sent:', JSON.stringify(payload, null, 2));
                this.dispatch({ type: 'CHALLENGE_SENT', payload });

                const timerId = setTimeout(() => {
                    this.dispatch({ type: 'CHALLENGE_TIMEOUT', payload: userId });
                    this._challengeTimers.delete(userId);
                }, 30000);
                this._challengeTimers.set(userId, timerId);
            }

            async cancelChallenge() {
                const s = this.sentChallenge;
                if (s?.status === 'pending') {
                    await this._lobby.cancelChallenge(s.recipientId, s.ruleType);
                    this.clearSentChallenge();
                }
            }

            clearSentChallenge() {
                const s = this.sentChallenge;
                if (s) {
                    this._clearTimerFor(s.recipientId);
                    this.dispatch({ type: 'CHALLENGE_DISMISS', payload: s.recipientId });
                }
            }

            _clearTimerFor(userId) {
                const t = this._challengeTimers.get(userId);
                if (t) {
                    clearTimeout(t);
                    this._challengeTimers.delete(userId);
                }
            }

            _clearAllChallengeTimers() {
                for (const timerId of this._challengeTimers.values()) clearTimeout(timerId);
                this._challengeTimers.clear();
            }

            async acceptChallenge() {
                const c = this.activeChallenge;
                this._table = await this._lobby.acceptChallenge(c.challengerId, c.ruleType, c.tableId, c.options);
                this.dispatch({
                    type: 'MATCH_SET',
                    payload: { tableId: c.tableId, ruleType: c.ruleType, options: c.options, isFirst: false }
                });
            }

            async declineChallenge() {
                const c = this.activeChallenge;
                await this._lobby.declineChallenge(c.challengerId, c.ruleType);
                this.dispatch({ type: 'CHALLENGE_DISMISS', payload: c.challengerId });
            }

            async leaveGame() {
                if (this._table) { await this._table.leave(); this._table = null; }
                await this._lobby.updatePresence({ tableId: undefined });
                this.dispatch({ type: 'MATCH_LEAVE' });
            }
        }

        // ── UI Components ──────────────────────────────────────────────────

        class UserList extends LitElement {
            static properties = {
                users:   { type: Array },
                myId:    { type: String },
                tableId: { type: String },
                isChallengePending: { type: Boolean },
            };
            static styles = [SHARED_STYLES, USER_LIST_STYLES];

            render() {
                const others = (this.users || []).filter(u => u.userId !== this.myId);
                if (others.length === 0) {
                    return html`<div style="padding: 1rem; text-align: center; color: #757575; font-style: italic; font-size: 0.8rem;">
                        No other players online yet. Invite a friend!
                    </div>`;
                }
                return html`<ul>${others.map(u => this._row(u))}</ul>`;
            }

            _row(u) {
                const isMe   = u.userId === this.myId;
                let actions  = html``;
                if (!isMe) {
                    if (canChallenge(u, this.myId)) {
                        actions = html`<button class="btn-challenge" aria-label="Challenge ${u.userName}" ?disabled=${this.isChallengePending} @click=${() => this._emit('challenge', u.userId)}>Challenge</button>`;
                    }
                }
                return html`
                    <li>
                        <div class="user-info">
                            <span class="user-name">${flag(u.meta?.country)} ${u.userName}${isMe ? ' (you)' : ''}</span>
                        </div>
                        <div class="actions">${actions}</div>
                    </li>`;
            }

            _emit(type, detail) {
                this.dispatchEvent(new CustomEvent(type, { detail, bubbles: true, composed: true }));
            }
        }

        class ChallengeBanner extends LitElement {
            static properties = { challenge: { type: Object } };
            static styles = [SHARED_STYLES, CHALLENGE_BANNER_STYLES];
            render() {
                if (!this.challenge) return html``;
                const c = this.challenge;
                const extras = Object.entries(c.options ?? {}).map(([k, v]) => `${k}: ${v}`);
                return html`
                    <div class="banner">
                        <strong>Challenge from ${c.challengerName}</strong>
                        <div class="details">
                            <span>📋 ${c.ruleType}</span>
                            ${extras.map(e => html`<span>${e}</span>`)}
                        </div>
                        <div class="row">
                            <button class="btn-accept" aria-label="Accept challenge" @click=${() => this._emit('accept')}>Accept</button>
                            <button class="btn-decline" aria-label="Decline challenge" @click=${() => this._emit('decline')}>Decline</button>
                        </div>
                    </div>`;
            }
            _emit(type) {
                this.dispatchEvent(new CustomEvent(type, { bubbles: true, composed: true }));
            }
        }

        class SentChallengeBanner extends LitElement {
            static properties = { challenge: { type: Object } };
            static styles = [SHARED_STYLES, SENT_CHALLENGE_BANNER_STYLES];
            render() {
                if (!this.challenge) return html``;
                const c = this.challenge;
                const isWaiting = c.status === 'pending';
                const isDecline = c.status === 'declined';
                const isTimeout = c.status === 'timeout';

                return html`
                    <div class="banner ${c.status}">
                        <div class="row">
                            <strong>
                                ${isWaiting ? `⏳ Waiting for ${c.recipientName}…` : ''}
                                ${isDecline ? `❌ ${c.recipientName} declined your challenge.` : ''}
                                ${isTimeout ? `🕒 Challenge to ${c.recipientName} timed out.` : ''}
                            </strong>
                            ${isWaiting
                                ? html`<button class="btn-leave" @click=${() => this._emit('cancel')}>Cancel</button>`
                                : html`<button @click=${() => this._emit('dismiss')} aria-label="Dismiss">✕</button>`
                            }
                        </div>
                        <div class="details">📋 ${c.ruleType}</div>
                    </div>`;
            }
            _emit(type) {
                this.dispatchEvent(new CustomEvent(type, { bubbles: true, composed: true }));
            }
        }

        class ChallengeModal extends LitElement {
            static properties = { userId: { type: String }, userName: { type: String } };
            static styles = [SHARED_STYLES, CHALLENGE_MODAL_STYLES];
            static RULES = [
                { id: 'eightball',     label: 'Eight Ball',       img: 'assets/eightball.png' },
                { id: 'nineball',      label: 'Nine Ball',        img: 'assets/nineball.png' },
                { id: 'threecushion',  label: 'Three Cushion',       img: 'assets/threecushion.png' },
                { id: 'threecushion',  label: 'Three Cushion (11)', img: 'assets/threecushion.png', options: { raceTo: '11' } },
                { id: 'threecushion',  label: 'Three Cushion (21)', img: 'assets/threecushion.png', options: { raceTo: '21' } },
                { id: 'snooker',       label: 'Snooker',             img: 'assets/snooker.png' },
                { id: 'snooker',       label: 'Snooker (6 reds)',    img: 'assets/snooker.png', options: { reds: '6' } },
            ];
            render() {
                if (!this.userId) return html``;
                return html`
                    <div class="backdrop" @click=${e => e.target === e.currentTarget && this._emit('cancel')}>
                        <div class="modal" role="dialog" aria-modal="true" aria-label="Select game type">
                            <h3>Challenge ${this.userName}</h3>
                            <div class="rules">
                                ${ChallengeModal.RULES.map(r => html`
                                    <button class="rule btn-challenge" @click=${() => this._emit('confirm', { ruleType: r.id, options: r.options })}>
                                        <span class="icon-wrap">
                                            <img src=${r.img} alt=${r.label} />
                                            ${r.options ? html`<span class="badge">${Object.values(r.options)[0]}</span>` : ''}
                                        </span>
                                        ${r.label}
                                    </button>`)}
                            </div>
                            <button class="cancel" @click=${() => this._emit('cancel')}>Cancel</button>
                        </div>
                    </div>`;
            }
            _emit(type, detail) {
                this.dispatchEvent(new CustomEvent(type, { detail, bubbles: true, composed: true }));
            }
        }

        // ── Main App ───────────────────────────────────────────────────────

        class LobbyApp extends LitElement {
            static styles = LOBBY_APP_STYLES;

            constructor() {
                super();
                this._ctrl = new LobbyController(this);
                this._pendingChallenge = null; // { userId, userName }
            }

            _renderStatusBar() {
                const c = this._ctrl;
                return html`
                    <div class="status-bar">
                        <span class="dot ${c.connected ? 'on' : ''}"></span>
                        <strong>${c.myName}</strong>
                        <span style="color:#757575;font-size:0.75rem">${c.connected ? 'online' : 'connecting…'} · ${c.users.length} online</span>
                        <a href="solo.html?clientId=${c.myId}&userName=${encodeURIComponent(c.myName)}" style="margin-left:auto;font-size:0.75rem">Solo Practice</a>
                    </div>`;
            }

            _renderUsers() {
                const c = this._ctrl;
                return html`
                    <challenge-banner
                        .challenge=${c.activeChallenge}
                        @accept=${() => c.acceptChallenge()}
                        @decline=${() => c.declineChallenge()}>
                    </challenge-banner>
                    <sent-challenge-banner
                        .challenge=${c.sentChallenge}
                        @cancel=${() => c.cancelChallenge()}
                        @dismiss=${() => c.clearSentChallenge()}>
                    </sent-challenge-banner>
                    <div class="panel">
                        <div class="panel-title">Online Players (${c.users.length})</div>
                        <user-list
                            .users=${c.users}
                            myId=${c.myId}
                            tableId=${c.tableId || ''}
                            .isChallengePending=${c.sentChallenge?.status === 'pending'}
                            @challenge=${e => {
                                const u = c.users.find(u => u.userId === e.detail);
                                this._pendingChallenge = { userId: e.detail, userName: u?.userName ?? e.detail };
                                this.requestUpdate();
                            }}>
                        </user-list>
                    </div>`;
            }

            _renderGamePanel() {
                const c = this._ctrl;
                if (!c.tableId) return html``;
                const url = gameUrl({ tableId: c.tableId, userId: c.myId, userName: c.myName, ruleType: c.ruleType, isFirst: c.isFirst, options: c.matchOptions });
                window.location.href = url;
                return html``;
            }

            render() {
                const p = this._pendingChallenge;
                return html`
                    ${this._renderStatusBar()}
                    ${this._renderUsers()}
                    ${this._renderGamePanel()}
                    <challenge-modal
                        .userId=${p?.userId ?? null}
                        .userName=${p?.userName ?? ''}
                        @confirm=${e => { this._ctrl.challenge(p.userId, e.detail.ruleType, e.detail.options); this._pendingChallenge = null; }}
                        @cancel=${() => { this._pendingChallenge = null; this.requestUpdate(); }}>
                    </challenge-modal>
                `;
            }
        }

        customElements.define('user-list',        UserList);
        customElements.define('challenge-banner', ChallengeBanner);
        customElements.define('sent-challenge-banner', SentChallengeBanner);
        customElements.define('challenge-modal',  ChallengeModal);
        customElements.define('lobby-app',        LobbyApp);
    </script>
</body>
</html>
