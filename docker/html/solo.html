<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Solo</title>
</head>
<body>
    <solo-app></solo-app>

    <script type="module">
        import { LitElement, html, css } from 'https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js';

        const GAMES = [
            { label: "Eight Ball",         img: "assets/eightball.png",    ruletype: "eightball" },
            { label: "Nine Ball",          img: "assets/nineball.png",     ruletype: "nineball" },
            { label: "Snooker",            img: "assets/snooker.png",      ruletype: "snooker" },
            { label: "Snooker (6 reds)",   img: "assets/snooker.png",      ruletype: "snooker",      options: { reds: "6" } },
            { label: "3-Cushion",          img: "assets/threecushion.png", ruletype: "threecushion" },
            { label: "3-Cushion (11)",     img: "assets/threecushion.png", ruletype: "threecushion", options: { raceTo: "11" } },
            { label: "3-Cushion (21)",     img: "assets/threecushion.png", ruletype: "threecushion", options: { raceTo: "21" } },
            { label: "Trickshot",          img: "assets/practice.png",     url: "https://billiards.tailuge.workers.dev/practice" },
        ];

        const soloUrl = (g, userId, userName) => {
            if (g.url) return g.url;
            let url = `https://billiards.tailuge.workers.dev/?ruletype=${g.ruletype}&clientId=${encodeURIComponent(userId)}&name=${encodeURIComponent(userName)}`;
            if (g.options) Object.entries(g.options).forEach(([k, v]) => url += `&${k}=${encodeURIComponent(v)}`);
            return url;
        };

        class SoloApp extends LitElement {
            static styles = css`
                :host { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background: #f5f5f5; gap: 1rem; }
                h2 { margin: 0; font-size: 1rem; color: #555; }
                .games { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
                .game-btn { border: none; background: none; cursor: pointer; padding: 0.4rem; text-align: center; opacity: 0.7; }
                .game-btn:hover { opacity: 1; }
                .game-btn img { display: block; width: 64px; height: 64px; }
                .game-btn span { font-size: 0.7rem; display: block; margin-top: 0.2rem; }
                .icon-wrap { position: relative; width: 64px; height: 64px; }
                .icon-wrap img { width: 64px; height: 64px; display: block; }
                .badge { position: absolute; bottom: 0; right: 0; background: #dc3545; color: #fff; font-size: 0.55rem; font-weight: bold; border-radius: 3px; padding: 0 2px; line-height: 1.3; }
            `;

            connectedCallback() {
                super.connectedCallback();
                const p = new URLSearchParams(location.search);
                this._userId   = p.get('id')   || 'user-' + Math.random().toString(36).slice(2, 7);
                this._userName = p.get('name') || 'Player';
            }

            render() {
                return html`
                    <h2>Choose a game</h2>
                    <div class="games">
                        ${GAMES.map(g => html`
                            <button class="game-btn" title=${g.label} aria-label="Play ${g.label}"
                                @click=${() => { window.location.href = soloUrl(g, this._userId, this._userName); }}>
                                <span class="icon-wrap">
                                    <img src=${g.img} alt=${g.label} />
                                    ${g.options ? html`<span class="badge">${Object.values(g.options)[0]}</span>` : ''}
                                </span>
                                <span>${g.label}</span>
                            </button>`)}
                    </div>`;
            }
        }

        customElements.define('solo-app', SoloApp);
    </script>
</body>
</html>
