# Only two of the CORS headers below are read on a non-preflight response: the
# browser ignores Allow-Methods/Allow-Headers there, and nothing in the client
# reads ETag or Last-Modified, so Expose-Headers buys nothing. The preflight-only
# set stays in the OPTIONS block, where it is the entire answer.
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Credentials $cors_cred always;

if ($request_method = 'OPTIONS') {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials $cors_cred always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization, Last-Modified, If-Modified-Since, ETag" always;
    # Every presence publish (JSON POST) and usage counter (JSON PUT) is a
    # non-simple request, so without a max-age Chrome re-preflights each one on
    # its 5s default. Ten minutes removes nearly all of those round trips; the
    # cap is deliberately short while the trimmed header set beds in. Browsers
    # clamp this themselves (Chrome 7200s, Firefox 86400s).
    add_header Access-Control-Max-Age 600;
    # This block's add_header directives replace the location's set, so Vary
    # has to be repeated here or the 204 loses it.
    add_header Vary Origin always;
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
}
