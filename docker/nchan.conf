server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    client_max_body_size 1m;
    client_body_buffer_size 64k;

    # Shared configuration (Inherited ONLY if location doesn't define its own headers)
    include /etc/nginx/metadata_headers.conf;

    # Health check endpoint
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
    }

    # Online Users API
    location = /api/online {
        js_content nchan_meta.online_users_api;
        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
    }

    # Publisher endpoint table
    location ~ ^/publish/table/(?<tableId>[\w-]+)$ {
        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
        js_content nchan_meta.publish;
    }

    location ~ ^/internal/publish/table/(?<tableId>[\w-]+)$ {
        internal;
        nchan_publisher;
        nchan_channel_id $tableId;
        nchan_message_buffer_length 2000;
        default_type application/json;
    }

    # Publisher endpoint presence
    location = /publish/presence/lobby {
        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
        js_content nchan_meta.publish;
    }

    location = /internal/publish/presence/lobby {
        internal;
        nchan_publisher;
        nchan_channel_id "presence/lobby";
        nchan_message_buffer_length 2000;
        nchan_message_timeout 90s;
        default_type application/json;
    }

    # Subscriber endpoint table
    location ~ ^/subscribe/table/(?<tableId>[\w-]+)$ {
        access_log /var/log/nginx/access.log main;
        nchan_subscriber;
        nchan_channel_id $tableId;
        nchan_message_buffer_length 0;
        nchan_message_timeout 0;
        nchan_subscriber_first_message oldest;
        nchan_subscriber_timeout 7200s;
        nchan_websocket_ping_interval 20s;
        nchan_unsubscribe_request /internal/table/unsub$is_args$args;

        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
    }

    # Subscriber endpoint presence
    location = /subscribe/presence/lobby {
        access_log /var/log/nginx/access.log main;
        nchan_subscriber;
        nchan_channel_id "presence/lobby";
        nchan_message_buffer_length 2000;
        nchan_message_timeout 90s;
        nchan_subscriber_first_message oldest;
        nchan_subscriber_timeout 7200s;
        nchan_websocket_ping_interval 20s;
        nchan_subscribe_request /internal/presence/sub$is_args$args;
        nchan_unsubscribe_request /internal/presence/unsub$is_args$args;

        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
    }

    location ^~ /internal/presence/sub {
        internal;
        access_log /var/log/nginx/access_file.log main;
        proxy_pass http://127.0.0.1:8080/internal/njs/presence_sub$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Nchan-Channel-Id $nchan_channel_id;
        proxy_set_header X-Nchan-Subscriber-Type $nchan_subscriber_type;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-User-Id $arg_uid;
        proxy_set_header X-Referrer $arg_ref;
    }

    location ^~ /internal/njs/presence_sub {
        js_content nchan_meta.presence_sub;
    }

    location ^~ /internal/presence/unsub {
        internal;
        proxy_pass http://127.0.0.1:8080/internal/njs/presence_unsub$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Nchan-Channel-Id $nchan_channel_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User-Id $arg_uid;
    }

    location ^~ /internal/njs/presence_unsub {
        js_content nchan_meta.presence_unsub;
    }

    location ^~ /internal/table/unsub {
        internal;
        proxy_pass http://127.0.0.1:8080/internal/njs/table_unsub$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Nchan-Channel-Id $nchan_channel_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User-Id $arg_uid;
    }

    location ^~ /internal/njs/table_unsub {
        js_content nchan_meta.table_unsub;
    }

    # Basic status monitoring
    location = /basic_status {
        stub_status;
        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
    }

    # Extended stats
    location /nchan_stats {
        nchan_stub_status;
        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
    }

    # API Router
    location /api/ {
        js_content api.router;
        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
    }

    # Aggregated Stats API
    location = /api/stats {
        js_content nchan_meta.stats;
        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
    }

    # Serve static files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        expires -1;
        include /etc/nginx/metadata_headers.conf;
        include /etc/nginx/cors.conf;
    }
}
