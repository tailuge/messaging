# Arena chat pub/sub locations keep Nchan's built-in CORS headers
# (nchan_access_control_allow_origin defaults to $http_origin,
#  nchan_access_control_allow_credentials defaults to on).
# nginx only answers the browser's OPTIONS preflight here, so the
# actual POST/GET response carries a single ACAO header instead of two.
if ($request_method = 'OPTIONS') {
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization" always;
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
}
