# Load dynamic modules (must be before http block)
load_module /etc/nginx/modules/ngx_http_js_module.so;
load_module /etc/nginx/modules/ngx_nchan_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log info;
error_log /var/log/nginx/njs_error.log info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # NJS Shared Zones
    js_shared_dict_zone zone=ip_cache:1M type=string timeout=1d;
    js_shared_dict_zone zone=system_stats:1M type=string timeout=1d;

    # NJS Imports
    js_import nchan_meta from /etc/nginx/nchan_meta.js;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format  detailed '[$time_local] "$request" '
                         'status=$status bytes=$body_bytes_sent '
                         'rt=$request_time rl=$request_length '
                         'ua="$http_user_agent" rid=$request_id';

    # Skip routine Render health checks in the access log.
    map $http_user_agent $loggable {
        ~*Render/1.0  0;
        default       1;
    }

    access_log  /var/log/nginx/access.log  detailed if=$loggable;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    gzip on;
    gzip_types text/plain application/json application/javascript;

    # Nchan shared memory configuration
    nchan_shared_memory_size 128M;

    # NJS configuration
    # Required for ngx.fetch DNS resolution inside NJS
    # Prefer public resolvers to avoid LAN DNS outages/timeouts
    resolver 1.1.1.1 8.8.8.8 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;
    js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Include configs
    include /etc/nginx/conf.d/*.conf;
}
