# Load dynamic modules (must be before http block)
load_module /etc/nginx/modules/ngx_http_js_module.so;
load_module /etc/nginx/modules/ngx_nchan_module.so;

env UPSTASH_URL;
env UPSTASH_REDIS_REST_TOKEN;
env UPSTASH_REDIS_REST_URL;

worker_processes 2;

# Single error log: Nginx writes every record to each error_log directive, so a
# second file doubled the formatting and write cost on every log line. Kept at
# njs_error.log because /api/stats (getNjsLogs) reads it for the dashboard.
error_log /var/log/nginx/njs_error.log info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main  '$remote_addr [$time_local] "$request" $status '
                      'rt=$request_time bytes=$bytes_sent req_len=$request_length '
                      'uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                      'upstream="$upstream_addr" upstream_status="$upstream_status" '
                      'conn=$connection conn_reqs=$connection_requests req_id=$request_id '
                      'conn_time=$connection_time completion=$request_completion '
                      '"$http_host" "$http_origin" "$http_user_agent" '
                      'upgrade="$http_upgrade" conn_hdr="$http_connection"';

    # Skip routine Render health checks in the access log.
    map $http_user_agent $loggable {
        ~*Render/1.0  0;
        default       1;
    }

    # CORS Origin fallback when $http_origin is not sent (e.g. direct API calls)
    map $http_origin $cors_origin {
        default $http_origin;
        ""      "*";
    }

    # Rate limiting for /api/* only (see nchan.conf): nothing is limited unless a
    # location opts in with limit_req, so nchan publish/subscribe is untouched.
    # Render terminates TLS in front of this container, so $remote_addr is the
    # proxy; prefer the forwarded client IP the same way nchan_meta.js does.
    map $http_x_forwarded_for $xff_client_ip {
        "~*^([^,\s]+)" $1;
        default        "";
    }
    map $http_cf_connecting_ip $client_ip {
        default $http_cf_connecting_ip;
        ""      $http_x_real_ip;
    }
    map $client_ip $real_client_ip {
        default $client_ip;
        ""      $xff_client_ip;
    }
    map $real_client_ip $api_client_key {
        default $real_client_ip;
        ""      $binary_remote_addr;
    }
    limit_req_zone $api_client_key zone=api:10m rate=60r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    access_log  /var/log/nginx/access.log  main buffer=32k flush=1s if=$loggable;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain application/json application/javascript;

    # Nchan shared memory configuration
    nchan_shared_memory_size 32M;

    # NJS shared dicts. Every zone is one shared segment for ALL workers, so a
    # size is never multiplied by worker_processes; it is the total budget for
    # in-memory entries. Zones are sized from the data they actually hold (see
    # each comment) and 32K is the smallest size nginx accepts.
    #
    # Per-IP geo/UA/origin cache + "rref:" referrer lists, 24h TTL. obfuscateIp
    # masks every octet but the last, so keys collapse to at most 256 IPv4
    # buckets regardless of traffic; values cap at ~450 B (two raw 200-char UAs
    # plus the origin list). 256K leaves room for those few hundred entries with
    # slab rounding, and is far more than 24h of traffic can populate.
    js_shared_dict_zone zone=ip_cache:256K type=string timeout=1d;
    # Six fixed counters (publish_requests_total, presence_* totals, start_time)
    # that are read-modify-written by incrementStat(). 32K (the nginx minimum)
    # already held them ~1000x over; 64K keeps every zone at or above that.
    js_shared_dict_zone zone=system_stats:64K type=string timeout=1d;
    # Last published presence frame per user, keyed "u:<userId>". Each entry also
    # carries a per-entry TTL (70 s) set by nchan_meta.js; the zone timeout is
    # only garbage collection for entries whose TTL could not be applied.
    # Frames are ~300-500 B, so 128K is roughly 240 concurrent users — well above
    # a low-volume lobby, and this is the one zone where a full dict would be
    # visible (users silently missing from the dashboard).
    js_shared_dict_zone zone=presence_live:128K type=string timeout=10m;
    # Users-online history for usage.html: one "s:<minute>" -> peak count entry
    # per minute (see recordPresenceCount in nchan_meta.js), so the entry count
    # is bounded by time rather than by join/leave churn: 1440 entries/day, and
    # the 2d timeout tops out at ~2900.
    # Measured cost is ~170 B/entry (15-byte key, 1-3 byte value, slab rounding,
    # from a full 64K zone holding 383 samples), so the full two days need
    # ~490K; 1M leaves 2x headroom. Deliberately no evict: at the old 64K size
    # the zone filled in ~4 hours, every later set() failed silently and the
    # chart froze until the next process restart; the minute buckets keep the
    # entry count bounded so that no longer happens.
    js_shared_dict_zone zone=presence_history:1M type=string timeout=2d;
    # The response cache behind /api/summary: 30s is the lifetime an entry gets
    # when the handler passes no TTL of its own. The usage and ELO reads in
    # api.njs do pass one (an hour, in milliseconds), so this default only ever
    # applies to the summary response itself.
    #
    # Sized from the payloads: "usage:all" is the big one at ~72 KB today and
    # grows ~0.6 KB/day (17 metrics x one ~34 B row per day, kept in Redis, not
    # in the zone), and a "summary:<elo>:<matches>" entry is ~20 KB. 1M holds
    # today's set with room for years of series growth plus the per-metric
    # "usage:<metric>" entries an external GET can add. 512K would fill once the
    # usage series roughly triples; 1M gives 2x that headroom.
    js_shared_dict_zone zone=summary_cache:1M type=string timeout=30s;
    js_import nchan_meta from /etc/nginx/nchan_meta.js;
    js_import api from /etc/nginx/api.njs;
    # Required for ngx.fetch DNS resolution inside NJS
    # Prefer public resolvers to avoid LAN DNS outages/timeouts
    # resolver 1.1.1.1 8.8.8.8 127.0.0.11 ipv6=off valid=60s;
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=60s;
    
    resolver_timeout 5s;
    js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Include configs
    include /etc/nginx/conf.d/*.conf;
}
