<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podium Showcase</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --gold: #ffb703;
            --gold-grad: linear-gradient(180deg, #ffe066 0%, #ffb703 100%);
            --silver: #94a3b8;
            --silver-grad: linear-gradient(180deg, #e2e8f0 0%, #94a3b8 100%);
            --bronze: #d97706;
            --bronze-grad: linear-gradient(180deg, #fde68a 0%, #cd7f32 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 8px;
            height: 220px;
            padding-bottom: 8px;
        }

        .step {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            transition: transform 0.2s ease;
        }

        .step:hover {
            transform: translateY(-4px);
        }

        .avatar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
        }

        .crown {
            font-size: 1.2rem;
            line-height: 1;
            margin-bottom: 2px;
            animation: bounce 2s infinite ease-in-out;
        }

        .emoji-avatar {
            font-size: 2.2rem;
            line-height: 1;
        }

        .name {
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90px;
        }

        .score {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 6px;
        }

        .block {
            width: 100%;
            border-radius: 8px 8px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 8px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4);
        }

        /* 1st Place (Gold) */
        .gold .block {
            height: 120px;
            background: var(--gold-grad);
        }
        .gold .rank-num { font-size: 1.5rem; }

        /* 2nd Place (Silver) */
        .silver .block {
            height: 85px;
            background: var(--silver-grad);
        }
        .silver .rank-num { font-size: 1.25rem; }

        /* 3rd Place (Bronze) */
        .bronze .block {
            height: 60px;
            background: var(--bronze-grad);
        }
        .bronze .rank-num { font-size: 1.1rem; }

        .medal-icon {
            font-size: 1.1rem;
            margin-top: 2px;
        }

        .controls {
            margin-top: 1.25rem;
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: #f1f5f9;
            color: #334155;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn:hover {
            background: #e2e8f0;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏆 Leaderboard</h1>

        <div class="podium-container">
            <!-- 2nd Place: Silver -->
            <div class="step silver">
                <div class="avatar-group">
                    <span class="emoji-avatar">🥈</span>
                    <span class="name" id="name-2">Alex</span>
                    <span class="score" id="score-2">2,450 pts</span>
                </div>
                <div class="block">
                    <span class="rank-num">2</span>
                    <span class="medal-icon">🥈</span>
                </div>
            </div>

            <!-- 1st Place: Gold -->
            <div class="step gold">
                <div class="avatar-group">
                    <span class="crown">👑</span>
                    <span class="emoji-avatar">🥇</span>
                    <span class="name" id="name-1">Sarah</span>
                    <span class="score" id="score-1">3,120 pts</span>
                </div>
                <div class="block">
                    <span class="rank-num">1</span>
                    <span class="medal-icon">🥇</span>
                </div>
            </div>

            <!-- 3rd Place: Bronze -->
            <div class="step bronze">
                <div class="avatar-group">
                    <span class="emoji-avatar">🥉</span>
                    <span class="name" id="name-3">Mike</span>
                    <span class="score" id="score-3">1,890 pts</span>
                </div>
                <div class="block">
                    <span class="rank-num">3</span>
                    <span class="medal-icon">🥉</span>
                </div>
            </div>
        </div>


    </div>

    <script>
        const names = ["Sarah 👑", "Alex ⚡", "Mike 🚀", "Elena 🌟", "David 🎯", "Chloe 🎨"];

        function shuffleWinners() {
            const shuffled = [...names].sort(() => 0.5 - Math.random());
            
            document.getElementById('name-1').innerText = shuffled[0].split(' ')[0];
            document.getElementById('score-1').innerText = (Math.floor(Math.random() * 1000) + 3000) + ' pts';

            document.getElementById('name-2').innerText = shuffled[1].split(' ')[0];
            document.getElementById('score-2').innerText = (Math.floor(Math.random() * 800) + 2000) + ' pts';

            document.getElementById('name-3').innerText = shuffled[2].split(' ')[0];
            document.getElementById('score-3').innerText = (Math.floor(Math.random() * 500) + 1200) + ' pts';
        }

        function celebrate() {
            const crown = document.querySelector('.crown');
            crown.style.transform = 'scale(1.5)';
            setTimeout(() => {
                crown.style.transform = 'scale(1)';
            }, 300);
        }
    </script>
</body>
</html>
